function home(){var d=day(),a=S.events.filter(function(e){return e.date===d}),g=new Set(a.filter(function(e){return e.res==='good'}).map(function(e){return e.wordId})).size,b=new Set(a.filter(function(e){return e.res==='bad'}).map(function(e){return e.wordId})).size;$('home').innerHTML='<div class="grid"><div class="card entry"><div><h2>今日学习</h2><p>只听声音判断。熟悉就毕业，不熟会在今天后面继续出现。</p></div><button id="start" class="primary">开始听词</button></div><div class="card entry"><div><h2>手打强化</h2><p>可按具体日期筛选当天的不熟词，再做主动中文提取。</p></div><button id="topen" class="primary">进入手打</button></div><div class="card"><div class="small">今天已毕业</div><div class="stat">'+g+'</div><div class="small">有过不熟 '+b+'</div></div><div class="card"><div class="small">词库总量</div><div class="stat">'+S.words.filter(function(w){return!w.ret}).length+'</div></div></div><div class="card" style="margin-top:14px"><h2 style="margin-top:0">今天学多少</h2><div class="row"><div class="field"><label>新词</label><input id="newN" type="number" value="'+S.set.newN+'"></div><div class="field"><label>复习</label><input id="revN" type="number" value="'+S.set.reviewN+'"></div></div><div class="small" style="margin-top:10px">当天第一次判断是主信号；后续不熟只做小幅困难加权。</div></div>';$('start').onclick=start;$('topen').onclick=function(){go('type')};$('newN').onchange=function(){S.set.newN=Math.max(0,+this.value||0);save()};$('revN').onchange=function(){S.set.reviewN=Math.max(0,+this.value||0);save()}}
function start(){var now=Date.now(),seen=new Set(S.events.filter(function(e){return e.cold}).map(function(e){return e.wordId})),r=S.words.filter(function(w){return!w.ret&&seen.has(w.id)&&(w.next||0)<=now}),f=S.words.filter(function(w){return!w.ret&&!seen.has(w.id)});r.sort(function(a,b){return(b.diff||0)-(a.diff||0)||(a.next||0)-(b.next||0)});f.sort(function(a,b){return(b.src.length-a.src.length)});var q=r.slice(0,S.set.reviewN).concat(f.slice(0,S.set.newN));if(!q.length)q=S.words.filter(function(w){return!w.ret}).slice(0,20);sess={q:q,i:0,show:false,res:null};cur='study';document.querySelectorAll('.view').forEach(function(x){x.classList.remove('on')});$('study').classList.add('on');$('ey').textContent='听音';$('title').textContent='今日学习';nav();study();if(q[0])setTimeout(function(){speak(q[0].en)},60)}function cw(){return sess&&sess.q[sess.i]}
function study(){var w=cw();if(!w){$('study').innerHTML='<div class="card" style="text-align:center;padding:45px">这轮结束了<br><br><button id="back" class="primary">回首页</button></div>';$('back').onclick=function(){go('home')};return}var mid=sess.show?'<div><div class="word '+(sess.res==='good'?'good':'bad')+'">'+esc(w.en)+'</div><div class="mean">'+esc(w.zh||'暂无中文释义')+'</div><div class="meta">'+esc(w.pos||'')+(w.def?' · '+esc(w.def):'')+'</div>'+(w.ex.length?'<div class="ex">'+esc(w.ex[w.ex.length-1])+'</div>':'')+'</div>':'<div class="small">听到以后，意思能不能直接出来？</div>';$('study').innerHTML='<div class="card study"><div class="count">'+(sess.i+1)+' / '+sess.q.length+'</div><button id="ret" class="retire">退出循环</button><button id="sp" class="speaker">◖))</button>'+mid+'<div class="judge"><button id="good" class="goodb">1　熟悉</button><button id="bad" class="badb">2　不熟悉</button></div><div class="hint">'+(sess.show?'再点 1/2 可修改':'判断后自动显示答案')+'</div>'+(sess.show?'<div class="mobileMove"><button id="prev" class="soft" '+(sess.i===0?'disabled':'')+'>上一词</button><button id="nxt" class="primary">下一词</button></div>':'')+'</div>';$('sp').onclick=function(){speak(w.en)};$('good').onclick=function(){judge('good')};$('bad').onclick=function(){judge('bad')};$('ret').onclick=function(){w.ret=true;save();next(true)};if(sess.show){if($('prev'))$('prev').onclick=prev;if($('nxt'))$('nxt').onclick=function(){next(false)}}}function judge(r){var w=cw();if(!sess.show){sess.show=true;sess.res=r;ev(w,'listen',r)}else sess.res=r;study()}function next(skip){var w=cw();if(!skip&&sess.res==='bad')sess.q.push(w);sess.i++;sess.show=false;sess.res=null;study();var n=cw();if(n)setTimeout(function(){speak(n.en)},60)}function prev(){if(!sess||sess.i<=0)return;sess.i--;var w=cw(),a=S.events.filter(function(e){return e.wordId===w.id&&e.date===day()&&e.mode==='listen'});var last=a.length?a[a.length-1]:null;sess.show=!!last;sess.res=last?last.res:null;study()}
function typeLanding(){if(ts&&ts.active)return typeCard();$('type').innerHTML='<div class="card"><h2 style="margin-top:0">选择待强化词</h2><div class="row"><div class="field"><label>日期</label><input id="td" type="date" value="'+day()+'"></div><div class="field"><label>至少不熟几次</label><input id="tm" type="number" min="1" value="1"></div></div><br><button id="tb" class="primary">开始</button></div>';$('tb').onclick=function(){var d=$('td').value,m=Math.max(1,+$('tm').value||1),q=S.words.filter(function(w){return!w.ret&&S.events.filter(function(e){return e.wordId===w.id&&e.date===d&&e.res==='bad'}).length>=m});ts={active:true,q:q,i:0,show:false,res:null,input:''};typeCard();if(q[0])speak(q[0].en)}}function typeCard(){var w=ts.q[ts.i];if(!w){ts.active=false;$('type').innerHTML='<div class="card" style="text-align:center">这批强化完成了<br><br><button id="tr" class="primary">重新筛选</button></div>';$('tr').onclick=function(){ts=null;typeLanding()};return}if(!ts.show){$('type').innerHTML='<div class="card study"><div class="count">'+(ts.i+1)+' / '+ts.q.length+'</div><button id="tsp" class="speaker">◖))</button><div class="small">听音后写中文意思；不想写就空着按 Enter。</div><input id="ti" style="width:100%;font-size:21px;margin-top:18px" placeholder="输入中文意思…"><div class="row" style="margin-top:12px;width:100%;justify-content:center"><button id="treveal" class="soft">提交 / 看答案</button></div></div>';$('tsp').onclick=function(){speak(w.en)};$('ti').focus();function revealType(){ts.input=$('ti').value.trim();ts.show=true;typeCard()}$('treveal').onclick=revealType;$('ti').onkeydown=function(e){if(e.key==='Enter')revealType()}}else{$('type').innerHTML='<div class="card study"><button id="tsp" class="speaker">◖))</button><div class="word '+(ts.res==='good'?'good':ts.res==='bad'?'bad':'')+'">'+esc(w.en)+'</div><div class="mean">'+esc(w.zh||'暂无中文释义')+'</div>'+(ts.input?'<div class="ex">你写的是：'+esc(ts.input)+'</div>':'')+'<div class="judge"><button id="tg" class="goodb">1　熟悉</button><button id="tb2" class="badb">2　不熟悉</button></div><div class="hint">判断后可直接点下一词</div><div class="mobileMove"><button id="tprev" class="soft" '+(ts.i===0?'disabled':'')+'>上一词</button><button id="tnext" class="primary" '+(!ts.res?'disabled':'')+'>下一词</button></div></div>';$('tsp').onclick=function(){speak(w.en)};$('tg').onclick=function(){ts.res='good';ev(w,'type','good');typeCard()};$('tb2').onclick=function(){ts.res='bad';ev(w,'type','bad');typeCard()};if($('tprev'))$('tprev').onclick=typePrev;if($('tnext'))$('tnext').onclick=typeNext}}function typeNext(){if(!ts||!ts.show||!ts.res)return;var w=ts.q[ts.i];if(ts.res==='bad')ts.q.push(w);ts.i++;ts.show=false;ts.res=null;ts.input='';typeCard();var n=ts.q[ts.i];if(n)speak(n.en)}function typePrev(){if(!ts||ts.i<=0)return;ts.i--;var w=ts.q[ts.i],a=S.events.filter(function(e){return e.wordId===w.id&&e.date===day()&&e.mode==='type'}),last=a.length?a[a.length-1]:null;ts.show=true;ts.res=last?last.res:null;ts.input='';typeCard()}
function textView(){$('text').innerHTML='<div class="card"><h2 style="margin-top:0">文本听力</h2><textarea id="ta" placeholder="粘贴句子或剑雅 transcript…"></textarea><div class="row" style="margin-top:10px"><button id="pa" class="primary">播放全文</button><button id="ps" class="soft">播放选中</button><button id="as" class="soft">选中词加入词库</button></div><div class="row" style="margin-top:12px"><input id="book" value="文本词库" placeholder="词库名"><input id="zh" placeholder="中文释义，可留空"></div></div>';$('pa').onclick=function(){speak($('ta').value)};$('ps').onclick=function(){var a=$('ta');speak(a.value.slice(a.selectionStart,a.selectionEnd)||a.value)};$('as').onclick=function(){var a=$('ta'),x=a.value.slice(a.selectionStart,a.selectionEnd).trim().replace(/^[^A-Za-z'-]+|[^A-Za-z'-]+$/g,'');if(!x||/\s/.test(x))return toast('请只选中一个英文单词');add(x,$('zh').value.trim(),$('book').value.trim()||'文本词库','','');save();toast('已加入 '+x)}}
function lib(){var books=[];S.words.forEach(function(w){w.src.forEach(function(s){if(books.indexOf(s)<0)books.push(s)})});$('library').innerHTML='<div class="card"><h2 style="margin-top:0">导入词库</h2><div class="row"><input id="bn" value="我的词库"><input id="fi" type="file" accept=".csv,.txt,.tsv"><button id="im" class="primary">导入</button></div><div class="small" style="margin-top:8px">格式：英文,中文,词性,英文简释</div></div><div class="card" style="margin-top:14px"><div class="row"><b>词库 '+S.words.length+'</b><select id="bf"><option value="">全部来源</option>'+books.map(function(b){return'<option>'+esc(b)+'</option>'}).join('')+'</select></div><div id="wl" class="list"></div></div>';$('bf').onchange=draw;$('im').onclick=importF;draw()}function draw(){var f=$('bf').value,a=S.words.filter(function(w){return!f||w.src.indexOf(f)>=0});$('wl').innerHTML=a.map(function(w){return'<div class="item"><div><b>'+esc(w.en)+'</b><div class="small">'+esc(w.pos)+'</div></div><div>'+esc(w.zh||'—')+'<div>'+w.src.map(function(s){return'<span class="tag">'+esc(s)+'</span>'}).join('')+'</div></div></div>'}).join('')}function importF(){var f=$('fi').files[0];if(!f)return toast('先选文件');var r=new FileReader();r.onload=function(){var src=$('bn').value.trim()||'我的词库',lines=String(r.result).split(/\r?\n/).filter(Boolean),n=0;lines.forEach(function(line){var p=line.indexOf('\t')>=0?line.split('\t'):line.split(',');if(!p[0]||/^(word|english|单词)$/i.test(p[0].trim()))return;add(p[0],p[1]||'',src,p[2]||'',p[3]||'');n++});save();toast('已导入 '+n+' 行');lib()};r.readAsText(f)}
function stats(){var d={};S.events.forEach(function(e){d[e.date]=d[e.date]||{g:0,b:0,t:0};if(e.res==='good')d[e.date].g++;else d[e.date].b++;if(e.mode==='type')d[e.date].t++});var ks=Object.keys(d).sort().reverse();$('stats').innerHTML='<div class="grid"><div class="card"><div class="small">累计词数</div><div class="stat">'+S.words.length+'</div></div><div class="card"><div class="small">学习判断</div><div class="stat">'+S.events.length+'</div></div></div><div class="card" style="margin-top:14px">'+ks.map(function(k){return'<div class="item"><b>'+k+'</b><div>熟悉 '+d[k].g+' · 不熟 '+d[k].b+' · 手打 '+d[k].t+'</div></div>'}).join('')+'</div>'}
function dl(name,type,txt){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:type}));a.download=name;a.click()}function backup(){dl('listenwrite-'+day()+'.json','application/json',JSON.stringify(S,null,2))}$('backup').onclick=backup;window.addEventListener('keydown',function(e){var tag=document.activeElement&&document.activeElement.tagName;if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT')return;if(cur==='study'&&sess){if(e.key==='1')judge('good');if(e.key==='2')judge('bad');if(e.key==='Enter'&&sess.show)next(false)}if(cur==='type'&&ts&&ts.show){if(e.key==='1'){$('tg').click()}if(e.key==='2'){$('tb2').click()}if(e.key==='Enter')typeNext()}});
var statRange=30,statDay=null;
function statDateObj(x){var p=x.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function statKey(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function statPct(a,b){return b?Math.round(a*100/b)+'%':'—'}
function statDue(ts){if(!ts)return'未安排';var k=statKey(new Date(ts)),t=day();if(k===t)return'今天';var a=statDateObj(t),b=statDateObj(k),n=Math.round((b-a)/86400000);if(n===1)return'明天';if(n>1&&n<31)return n+'天后';if(n<0)return'已到期';return k.slice(5)}
function statEventsForRange(){if(!statRange)return S.events.slice();var st=new Date();st.setHours(0,0,0,0);st.setDate(st.getDate()-(statRange-1));return S.events.filter(function(e){return e.ts>=st.getTime()})}
function statWordEvents(id){return S.events.filter(function(e){return e.wordId===id}).sort(function(a,b){return a.ts-b.ts})}
stats=function(){
  if(!statDay)statDay=day();
  var E=statEventsForRange();
  var cold=E.filter(function(e){return e.cold});
  var coldGood=cold.filter(function(e){return e.res==='good'}).length;
  var bad=E.filter(function(e){return e.res==='bad'}).length;
  var typed=E.filter(function(e){return e.mode==='type'}).length;
  var uniq=new Set(E.map(function(e){return e.wordId})).size;
  var now=Date.now();
  var dueNow=S.words.filter(function(w){return!w.ret&&w.next&&w.next<=now}).length;

  var tabs='<div class="statsTabs"><button data-range="7" class="'+(statRange===7?'on':'')+'">7天</button><button data-range="30" class="'+(statRange===30?'on':'')+'">30天</button><button data-range="0" class="'+(!statRange?'on':'')+'">全部</button></div>';
  var summary='<div class="statsGrid">'
    +'<div class="statBox"><div class="statLabel">首轮熟悉率</div><div class="num">'+statPct(coldGood,cold.length)+'</div><div class="small">'+coldGood+' / '+cold.length+'</div></div>'
    +'<div class="statBox"><div class="statLabel">学习词数</div><div class="num">'+uniq+'</div><div class="small">本区间去重</div></div>'
    +'<div class="statBox"><div class="statLabel">不熟次数</div><div class="num">'+bad+'</div><div class="small">含当天循环</div></div>'
    +'<div class="statBox"><div class="statLabel">当前到期</div><div class="num">'+dueNow+'</div><div class="small">应该复习</div></div>'
    +'</div><div class="statsNote">“首轮熟悉率”只看每天第一次遇到某个词时的判断；当天为了学会它而重复出现的结果不重复计入这个比例。</div>';

  var activity={};
  S.events.forEach(function(e){activity[e.date]=(activity[e.date]||0)+1});
  var base=statDateObj(day()),dow=(base.getDay()+6)%7;base.setDate(base.getDate()-dow-28);
  var heat=[],mx=1;
  for(var hi=0;hi<35;hi++){var hd=new Date(base);hd.setDate(base.getDate()+hi);var hk=statKey(hd),hc=activity[hk]||0;if(hc>mx)mx=hc;heat.push({k:hk,n:hc,d:hd})}
  var heatHtml='<div class="card statSection"><div class="heatTitle"><div><b>学习日历</b><div class="small">点日期看具体单词</div></div><div class="small">手打 '+typed+'</div></div>'
    +'<div class="heatHead"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div><div class="heatGrid">'
    +heat.map(function(x){var op=x.n?(.16+.58*x.n/mx):.05,fu=x.k>day();return'<button class="heat '+(x.k===statDay?'sel ':'')+(fu?'future':'')+'" data-stat-day="'+x.k+'" '+(fu?'disabled':'')+' style="background:rgba(93,119,99,'+op.toFixed(2)+')"><span>'+x.d.getDate()+'</span>'+(x.n?'<b>'+x.n+'</b>':'')+'</button>'}).join('')+'</div></div>';

  var dayE=S.events.filter(function(e){return e.date===statDay}).sort(function(a,b){return a.ts-b.ts});
  var groups={};dayE.forEach(function(e){(groups[e.wordId]||(groups[e.wordId]=[])).push(e)});
  var dayRows=Object.keys(groups).map(function(id){var a=groups[id],w=S.words.find(function(x){return x.id===id}),first=a[0],fails=a.filter(function(e){return e.res==='bad'}).length,listen=a.filter(function(e){return e.mode==='listen'}).length,type=a.filter(function(e){return e.mode==='type'}).length;return{w:w,a:a,first:first,fails:fails,listen:listen,type:type}}).sort(function(a,b){return b.fails-a.fails||(a.w?a.w.en:'').localeCompare(b.w?b.w.en:'')});
  var dayCold=dayE.filter(function(e){return e.cold}),dayGood=dayCold.filter(function(e){return e.res==='good'}).length;
  var detail='<div class="card statSection"><div class="heatTitle"><div><b>'+statDay+' 详情</b><div class="small">首轮熟悉 '+statPct(dayGood,dayCold.length)+' · 判断 '+dayE.length+' 次 · '+dayRows.length+' 个词</div></div>'+(dayRows.some(function(x){return x.fails})?'<button id="dayPractice" class="soft">手打当天不熟</button>':'')+'</div><div class="dayRows">'
    +(dayRows.length?dayRows.map(function(x){var w=x.w||{en:'已删除词',src:[]};return'<div class="dayRow"><div><b>'+esc(w.en)+'</b><div class="small">'+((w.src||[]).slice(0,2).map(function(z){return esc(z)}).join(' · ')||'')+'</div></div><div class="'+(x.first.res==='good'?'ok':'miss')+'">首轮'+(x.first.res==='good'?'熟悉':'不熟')+'</div><div class="hideMobile">不熟 '+x.fails+'</div><div class="hideMobile">听 '+x.listen+' · 写 '+x.type+'</div></div>'}).join(''):'<div class="small" style="padding:18px 0">这一天还没有学习记录。</div>')+'</div></div>';

  var due=[],todayD=statDateObj(day());
  for(var di=0;di<7;di++){var dd=new Date(todayD);dd.setDate(dd.getDate()+di);due.push({k:statKey(dd),label:di===0?'今天':(di===1?'明天':(dd.getMonth()+1)+'/'+dd.getDate()),n:0})}
  S.words.filter(function(w){return!w.ret&&w.next}).forEach(function(w){var k=statKey(new Date(w.next));if(w.next<todayD.getTime())due[0].n++;else{var q=due.find(function(x){return x.k===k});if(q)q.n++}});
  var dueMax=Math.max.apply(null,due.map(function(x){return x.n}).concat([1]));
  var forecast='<div class="card statSection"><b>未来 7 天复习量</b><div class="small">按当前调度估算</div>'+due.map(function(x){return'<div class="dueRow"><span>'+x.label+'</span><div class="dueTrack"><div class="dueFill" style="width:'+(x.n/dueMax*100)+'%"></div></div><b>'+x.n+'</b></div>'}).join('')+'</div>';

  var wg={};
  E.forEach(function(e){if(!wg[e.wordId])wg[e.wordId]={bad:0,coldBad:0};if(e.res==='bad'){wg[e.wordId].bad++;if(e.cold)wg[e.wordId].coldBad++}});
  var hard=Object.keys(wg).map(function(id){var g=wg[id],w=S.words.find(function(x){return x.id===id});return{w:w,g:g,score:g.coldBad*4+(g.bad-g.coldBad)}}).filter(function(x){return x.w&&x.g.bad}).sort(function(a,b){return b.score-a.score||b.g.bad-a.g.bad}).slice(0,12);
  var hardHtml='<div class="card statSection"><div class="heatTitle"><div><b>困难词</b><div class="small">优先看“隔天再次想不起来”的词</div></div>'+(hard.length?'<button id="hardPractice" class="soft">手打这批</button>':'')+'</div><div class="hardList">'
    +(hard.length?hard.map(function(x){var h=statWordEvents(x.w.id).slice(-8);return'<div class="hardItem"><div class="hardTop"><div><div class="hardWord">'+esc(x.w.en)+'</div><div class="hardMeta">首轮不熟 '+x.g.coldBad+' 次 · 总不熟 '+x.g.bad+' 次 · 下次 '+statDue(x.w.next)+'</div></div><div>'+esc(x.w.zh||'')+'</div></div><div class="history">'+h.map(function(e){return'<span class="hist '+e.res+'">'+e.date.slice(5)+' '+(e.mode==='type'?'写':'听')+' '+(e.res==='good'?'熟':'不熟')+'</span>'}).join('')+'</div></div>'}).join(''):'<div class="small" style="padding:18px 0">这个区间没有不熟记录。</div>')+'</div></div>';

  $('stats').innerHTML=tabs+summary+heatHtml+detail+forecast+hardHtml;
  document.querySelectorAll('[data-range]').forEach(function(b){b.onclick=function(){statRange=+this.dataset.range;stats()}});
  document.querySelectorAll('[data-stat-day]').forEach(function(b){b.onclick=function(){statDay=this.dataset.statDay;stats()}});
  if($('dayPractice'))$('dayPractice').onclick=function(){var q=dayRows.filter(function(x){return x.fails&&x.w&&!x.w.ret}).map(function(x){return x.w});ts={active:true,q:q,i:0,show:false,res:null,input:''};go('type');if(q[0])speak(q[0].en)};
  if($('hardPractice'))$('hardPractice').onclick=function(){var q=hard.map(function(x){return x.w}).filter(function(w){return!w.ret});ts={active:true,q:q,i:0,show:false,res:null,input:''};go('type');if(q[0])speak(q[0].en)};
};
load();nav();home();})();
</script></body></html>
