</style></head><body><div class="app"><aside class="side"><div class="brand">听词<small>LISTEN · RECALL</small></div><nav id="nav" class="nav"></nav></aside><main class="main"><header class="top"><div><div id="eyebrow" class="eyebrow">今日</div><h1 id="title">学习</h1></div><button id="backupQuick" class="quiet">备份</button></header><section id="home" class="view on"></section><section id="study" class="view"></section><section id="type" class="view"></section><section id="text" class="view"></section><section id="library" class="view"></section><section id="stats" class="view"></section><section id="settings" class="view"></section></main><nav id="mobileNav" class="mobile-nav"></nav></div><div id="toast" class="toast"></div><input id="restoreFile" type="file" accept="application/json" hidden><script>
const NAV=[['home','今日','今日学习'],['type','手打','手打强化'],['text','文本','文本听力'],['library','词库','词库管理'],['stats','统计','学习统计'],['settings','设置','设置与备份']];const today=()=>new Date().toLocaleDateString('sv-SE');const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);const FSRS='https://cdn.jsdelivr.net/npm/ts-fsrs@5.4.1/+esm';let S={words:[],events:[],settings:{newCount:30,reviewCount:80,voice:'',rate:.92,retention:.9},createdAt:Date.now()},session=null,typing=null,current='home',fsrs:null;const sample=[['distribution','分布；分配','n.','the way something is spread or shared','The distribution of resources varies considerably between regions.'],['rural','乡村的；农村的','adj.','connected with the countryside','Many rural communities depend on local transport links.'],['decline','下降；减少','n./v.','to become smaller, fewer or less','The population began to decline after 2010.'],['agriculture','农业','n.','the practice of farming','Agriculture remains important in rural areas.'],['significant','显著的；重要的','adj.','large or important enough to be noticed','There was a significant increase in demand.']];
function dbOpen(){return new Promise((ok,no)=>{let r=indexedDB.open('listenwrite',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}async function load(){try{let d=await dbOpen(),t=d.transaction('kv'),r=t.objectStore('kv').get('state');S=await new Promise((o,n)=>{r.onsuccess=()=>o(r.result||S);r.onerror=()=>n(r.error)});d.close()}catch(e){let x=localStorage.getItem('listenwrite');if(x)S=JSON.parse(x)}if(!S.words.length)sample.forEach(x=>addWord(x[0],x[1],'示例词库',x[2],x[3],x[4]));render();loadFsrs()}async function save(){try{let d=await dbOpen(),t=d.transaction('kv','readwrite');t.objectStore('kv').put(S,'state');await new Promise((o,n)=>{t.oncomplete=o;t.onerror=()=>n(t.error)});d.close()}catch(e){localStorage.setItem('listenwrite',JSON.stringify(S))}}async function loadFsrs(){try{S.fsrsLoaded=false;let a=await import(FSRS);window.__fsrs=a;S.fsrsLoaded=true}catch(e){S.fsrsLoaded=false}}
function toast(x){let t=document.querySelector('#toast');t.textContent=x;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1200)}function addWord(en,zh,book='我的词库',pos='',def='',example=''){en=(en||'').trim().toLowerCase();if(!en)return null;let w=S.words.find(x=>x.en===en);if(!w){w={id:uid(),en,zh:(zh||'').trim(),pos:(pos||'').trim(),def:(def||'').trim(),sources:[],examples:[],retired:false,next:0,interval:0,fsrsCard:null,firstSeen:Date.now()};S.words.push(w)}if(zh&&!w.zh)w.zh=zh.trim();if(pos&&!w.pos)w.pos=pos.trim();if(def&&!w.def)w.def=def.trim();if(book&&!w.sources.includes(book))w.sources.push(book);if(example&&!w.examples.includes(example))w.examples.push(example);return w}
function dayEvents(w,d=today()){return S.events.filter(e=>e.wordId===w.id&&e.date===d).sort((a,b)=>a.ts-b.ts)}function dayInfo(w,d=today()){let a=dayEvents(w,d);return{n:a.length,fail:a.filter(e=>e.result==='bad').length,first:a[0]?.result,last:a.at(-1)?.result}}

function speak(txt){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(txt);u.lang='en-US';u.rate=Number(S.settings.rate)||.92;let vs=speechSynthesis.getVoices();if(S.settings.voice){let v=vs.find(x=>x.name===S.settings.voice);if(v)u.voice=v}speechSynthesis.speak(u)}function go(v){current=v;document.querySelectorAll('.view').forEach(x=>x.classList.remove('on'));document.querySelector('#'+v).classList.add('on');document.querySelector('#title').textContent=NAV.find(x=>x[0]===v)?.[2]||'';document.querySelector('#eyebrow').textContent=NAV.find(x=>x[0]===v)?.[1]||'';renderNav();renderView(v)}function renderNav(){document.querySelector('#nav').innerHTML=NAV.map(x=>`<button data-v="${x[0]}" class="${current===x[0]?'on':''}">${x[2]}</button>`).join('');document.querySelector('#mobileNav').innerHTML=NAV.slice(0,5).map(x=>`<button data-v="${x[0]}" class="${current===x[0]?'on':''}">${x[1]}</button>`).join('');document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>go(b.dataset.v))}function render(){renderNav();renderView(current)}function renderView(v){({home:renderHome,study:renderStudy,type:renderType,text:renderText,library:renderLibrary,stats:renderStats,settings:renderSettings}[v]||renderHome)()}
function renderHome(){let d=today(),done=new Set(S.events.filter(e=>e.date===d&&e.result==='good').map(e=>e.wordId)).size,bad=new Set(S.events.filter(e=>e.date===d&&e.result==='bad').map(e=>e.wordId)).size;document.querySelector('#home').innerHTML=`<div class="grid"><div class="card entry"><div><h2>今日学习</h2><p>只听声音做判断。不熟留在当天循环，直到熟悉才毕业。</p></div><button id="startStudy">开始听词</button></div><div class="card entry"><div><h2>手打强化</h2><p>按具体日期筛选不熟词，听音后主动写出中文核心意思。</p></div><button onclick="go('type')">进入手打</button></div><div class="card"><div class="small">今天已经毕业</div><div class="statline">${done}</div><div class="small">有过不熟的词 ${bad}</div></div><div class="card"><div class="small">词库总量</div><div class="statline">${S.words.filter(w=>!w.retired).length}</div><div class="small">重复词自动合并来源</div></div></div><div class="card" style="margin-top:16px"><h2 class="section-title">今天学多少</h2><div class="row"><div class="field"><label>新词</label><input id="newCount" type="number" min="0" max="500" value="${S.settings.newCount}"></div><div class="field"><label>复习</label><input id="reviewCount" type="number" min="0" max="1000" value="${S.settings.reviewCount}"></div></div><div class="small" style="margin-top:12px">跨天优先使用 FSRS；同一天的第一次判断是主信号，重复不熟只做轻微困难记录。</div></div>`;document.querySelector('#startStudy').onclick=startStudy;['newCount','reviewCount'].forEach(k=>document.querySelector('#'+k).onchange=e=>{S.settings[k]=Math.max(0,Number(e.target.value)||0);save()})}
function startStudy(){let now=Date.now(),seen=new Set(S.events.filter(e=>e.cold).map(e=>e.wordId)),review=S.words.filter(w=>!w.retired&&seen.has(w.id)&&(w.next||0)<=now),fresh=S.words.filter(w=>!w.retired&&!seen.has(w.id));review.sort((a,b)=>(b.sameDayDifficulty||0)-(a.sameDayDifficulty||0)||(a.next||0)-(b.next||0));fresh.sort((a,b)=>b.sources.length-a.sources.length);let q=[...review.slice(0,S.settings.reviewCount),...fresh.slice(0,S.settings.newCount)];if(!q.length)q=S.words.filter(w=>!w.retired).slice(0,Math.max(10,S.settings.reviewCount));session={q,idx:0,revealed:false,result:null,mode:'listen'};go('study');setTimeout(()=>speak(session.q[0]?.en||''),80)}function currentWord(){return session?.q?.[session.idx]}
function renderStudy(){let el=document.querySelector('#study');if(!session||!currentWord()){el.innerHTML='<div class="card empty">今天这轮已经结束。<br><br><button class="primary" onclick="go(\'home\')">回到首页</button></div>';return}let w=currentWord(),ans=session.revealed;el.innerHTML=`<div class="study-wrap"><div class="card study-card"><div class="progress">${session.idx+1} / ${session.q.length}</div><button class="retire" id="retire">退出循环</button><button class="speaker" id="speaker">◖))</button>${ans?`<div><div class="word ${session.result==='good'?'good':'bad'}">${esc(w.en)}</div><div class="meaning">${esc(w.zh||'暂无中文释义')}</div><div class="meta">${esc(w.pos||'')} ${w.def?'· '+esc(w.def):''}</div>${w.examples?.length?`<div class="example">${esc(w.examples.at(-1))}</div>`:''}</div>`:`<div class="prompt">听到以后，意思能不能直接出来？</div>`}<div class="judge"><button class="goodbtn" id="good">1　熟悉</button><button class="badbtn" id="bad">2　不熟悉</button></div><div class="hint">${ans?'Enter 下一词 · 1/2 可改判':'电脑可直接按 1 / 2'}</div></div></div>`;speaker.onclick=()=>speak(w.en);good.onclick=()=>judge('good');bad.onclick=()=>judge('bad');retire.onclick=()=>{w.retired=true;save();nextCard(true)}}
function judge(r){let w=currentWord();if(!w)return;if(!session.revealed){session.revealed=true;session.result=r;record(w,session.mode||'listen',r);renderStudy()}else if(session.result!==r){let last=[...S.events].reverse().find(e=>e.wordId===w.id&&e.date===today()&&e.mode===(session.mode||'listen'));if(last){last.result=r;if(last.cold)rebuildSchedule(w)}session.result=r;save();renderStudy()}}function nextCard(skip=false){let w=currentWord();if(!w)return;if(!skip&&session.result==='bad')session.q.push(w);session.idx++;session.revealed=false;session.result=null;renderStudy();let n=currentWord();if(n)setTimeout(()=>speak(n.en),60)}
function renderType(){let el=document.querySelector('#type');if(typing?.active)return renderTyping();let d=typing?.date||today(),min=typing?.min||1,mode=typing?.mode||'all';el.innerHTML=`<div class="card"><h2 class="section-title">选择待强化词</h2><div class="row"><div class="field"><label>哪一天的不熟词</label><input id="typeDate" type="date" value="${d}"></div><div class="field"><label>至少不熟几次</label><input id="typeMin" type="number" min="1" max="20" value="${min}"></div><div class="field"><label>来源</label><select id="typeMode"><option value="all">听音 + 手打</option><option value="listen">只看听音</option><option value="type">只看手打</option></select></div></div><br><button class="primary" id="startType">开始手打强化</button></div>`;typeMode.value=mode;startType.onclick=()=>{let date=typeDate.value,min=Number(typeMin.value)||1,m=typeMode.value;let ids=S.words.filter(w=>S.events.filter(e=>e.wordId===w.id&&e.date===date&&e.result==='bad'&&(m==='all'||e.mode===m)).length>=min&&!w.retired);typing={active:true,date,min,mode:m,q:ids,idx:0,revealed:false,result:null,input:''};renderType();if(ids[0])speak(ids[0].en)}}
function renderTyping(){let el=document.querySelector('#type'),w=typing.q[typing.idx];if(!w){typing.active=false;el.innerHTML='<div class="card empty">这批强化完成了。<br><br><button class="primary" id="againType">重新筛选</button></div>';againType.onclick=()=>{typing=null;renderType()};return}el.innerHTML=`<div class="typing-box"><div class="card study-card"><div class="progress">${typing.idx+1} / ${typing.q.length}</div><button class="speaker" id="tspeaker">◖))</button>${typing.revealed?`<div><div class="word ${typing.result==='good'?'good':typing.result==='bad'?'bad':''}">${esc(w.en)}</div><div class="meaning">${esc(w.zh||'暂无中文释义')}</div><div class="meta">${esc(w.pos||'')} ${w.def?'· '+esc(w.def):''}</div>${typing.input?`<div class="example">你写的是：${esc(typing.input)}</div>`:''}</div><div class="judge"><button class="goodbtn" id="tgood">1　熟悉</button><button class="badbtn" id="tbad">2　不熟悉</button></div><div class="hint">Enter 下一词</div>`:`<div class="prompt">听音后写出中文核心意思；不想写就空着按 Enter 看答案。</div><input id="typeInput" class="typing-input" placeholder="输入中文意思…" autocomplete="off"><div class="hint">有内容 Enter = 提交 · 空 Enter = 看答案</div>`}</div></div>`;tspeaker.onclick=()=>speak(w.en);if(!typing.revealed){typeInput.focus();typeInput.onkeydown=e=>{if(e.key==='Enter'){typing.input=typeInput.value.trim();typing.revealed=true;renderTyping()}}}else{tgood.onclick=()=>typeJudge('good');tbad.onclick=()=>typeJudge('bad')}}function typeJudge(r){let w=typing.q[typing.idx];typing.result=r;record(w,'type',r);renderTyping()}function typeNext(){if(!typing?.revealed||!typing.result)return;let w=typing.q[typing.idx];if(typing.result==='bad')typing.q.push(w);typing.idx++;typing.revealed=false;typing.result=null;typing.input='';renderTyping();let n=typing.q[typing.idx];if(n)setTimeout(()=>speak(n.en),60)}
function sentenceAt(text,pos){let s=text.split(/(?<=[.!?。！？])\s*/);let acc=0;for(let x of s){let n=acc+x.length;if(pos>=acc&&pos<=n)return x.trim();acc=n+1}return''}function renderText(){text.innerHTML=`<div class="card"><h2 class="section-title">文本听力</h2><textarea id="textArea" placeholder="粘贴句子、段落或剑雅 transcript…"></textarea><div class="row" style="margin-top:12px"><button class="primary" id="playAll">播放全文</button><button class="ghost" id="playSel">播放选中 / 当前句</button><button class="ghost" id="addSel">选中词加入词库</button></div><div class="row" style="margin-top:14px"><div class="field" style="min-width:220px"><label>加入哪个词库</label><input id="textBook" value="文本词库" placeholder="如：剑18 T3 P4"></div><div class="field"><label>中文释义（可稍后补）</label><input id="textZh" placeholder="可留空"></div></div></div>`;playAll.onclick=()=>speak(textArea.value);playSel.onclick=()=>speak(textArea.value.slice(textArea.selectionStart,textArea.selectionEnd)||sentenceAt(textArea.value,textArea.selectionStart)||textArea.value);addSel.onclick=()=>{let x=textArea.value.slice(textArea.selectionStart,textArea.selectionEnd).trim().replace(/^[^A-Za-z'-]+|[^A-Za-z'-]+$/g,'');if(!x||/\s/.test(x))return toast('请先只选中一个英文单词');let book=textBook.value.trim()||'文本词库',zh=textZh.value.trim(),ex=sentenceAt(textArea.value,textArea.selectionStart);addWord(x,zh,book,'','',ex);save();toast('已加入 '+x)}}
function renderLibrary(){let books=[...new Set(S.words.flatMap(w=>w.sources))].sort();library.innerHTML=`<div class="card"><h2 class="section-title">导入词库</h2><div class="row"><div class="field"><label>词库名</label><input id="bookName" value="我的词库"></div><div class="field"><label>CSV / TXT</label><input id="importWords" type="file" accept=".csv,.txt,.tsv,text/plain,text/csv"></div><button class="primary" id="importBtn">导入</button></div><div class="small" style="margin-top:10px">格式：英文,中文,词性,英文简释。重复英文只增加来源。</div></div><div class="card" style="margin-top:16px"><div class="row" style="justify-content:space-between"><h2 class="section-title" style="margin:0">词库 ${S.words.length}</h2><select id="bookFilter"><option value="">全部来源</option>${books.map(b=>`<option>${esc(b)}</option>`).join('')}</select></div><div id="wordTable" class="table"></div></div>`;bookFilter.onchange=drawWords;importBtn.onclick=importFile;drawWords()}function drawWords(){let f=bookFilter?.value||'',arr=S.words.filter(w=>!f||w.sources.includes(f));wordTable.innerHTML=arr.length?arr.slice(0,1000).map(w=>`<div class="wordrow"><div><b>${esc(w.en)}</b><div class="small">${esc(w.pos||'')}</div></div><div>${esc(w.zh||'—')}</div><div>${w.sources.map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div><div><button class="ghost" data-ret="${w.id}">${w.retired?'恢复':'退出循环'}</button></div></div>`).join(''):'<div class="empty">暂无词</div>';document.querySelectorAll('[data-ret]').forEach(b=>b.onclick=()=>{let w=S.words.find(x=>x.id===b.dataset.ret);w.retired=!w.retired;save();drawWords()})}async function importFile(){let file=importWords.files[0];if(!file)return toast('先选择文件');let book=bookName.value.trim()||'我的词库',txt=await file.text(),lines=txt.split(/\r?\n/).filter(Boolean),n=0;for(let line of lines){let p=line.includes('\t')?line.split('\t'):line.split(',');if(!p[0]||/^(word|english|单词)$/i.test(p[0].trim()))continue;addWord(p[0],p[1]||'',book,p[2]||'',p[3]||'');n++}save();toast('已导入 '+n+' 行');renderLibrary()}
function renderStats(){let by={};for(let e of S.events){by[e.date]??={good:0,bad:0,type:0,listen:0,coldBad:0};by[e.date][e.result]++;by[e.date][e.mode]=(by[e.date][e.mode]||0)+1;if(e.cold&&e.result==='bad')by[e.date].coldBad++}let rows=Object.entries(by).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,31);stats.innerHTML=`<div class="grid"><div class="card"><div class="small">累计词数</div><div class="statline">${S.words.length}</div></div><div class="card"><div class="small">累计学习判断</div><div class="statline">${S.events.length}</div></div></div><div class="card" style="margin-top:16px"><h2 class="section-title">最近学习</h2>${rows.length?rows.map(([d,x])=>`<div class="wordrow"><b>${d}</b><div>熟悉 ${x.good} · 不熟 ${x.bad}</div><div>首次不熟 ${x.coldBad} · 手打 ${x.type||0}</div><div></div></div>`).join(''):'<div class="empty">还没有学习记录</div>'}</div>`}
function renderSettings(){let voices=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));settings.innerHTML=`<div class="card"><h2 class="section-title">声音</h2><div class="row"><div class="field"><label>英语声音</label><select id="voice"><option value="">系统默认</option>${voices.map(v=>`<option value="${esc(v.name)}">${esc(v.name)} · ${esc(v.lang)}</option>`).join('')}</select></div><div class="field"><label>语速</label><input id="rate" type="number" min="0.6" max="1.5" step="0.05" value="${S.settings.rate}"></div><button class="ghost" id="testVoice">试听</button></div></div><div class="card" style="margin-top:16px"><h2 class="section-title">数据</h2><div class="row"><button class="primary" id="backup">导出 JSON 完整备份</button><button class="ghost" id="restore">恢复 JSON</button><button class="ghost" id="exportCsv">导出词表 CSV</button></div><div class="small" style="margin-top:12px">学习记录保存在当前浏览器；换设备前建议导出 JSON。</div></div>`;voice.value=S.settings.voice||'';voice.onchange=e=>{S.settings.voice=e.target.value;save()};rate.onchange=e=>{S.settings.rate=Number(e.target.value)||.92;save()};testVoice.onclick=()=>speak('distribution of resources');backup.onclick=backupData;restore.onclick=()=>restoreFile.click();exportCsv.onclick=exportCsv}
function download(name,type,txt){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function backupData(){download('listenwrite-backup-'+today()+'.json','application/json',JSON.stringify(S,null,2))}function exportCsv(){let q=s=>'"'+String(s||'').replaceAll('"','""')+'"';download('listenwrite-words.csv','text/csv;charset=utf-8','\ufeff英文,中文,词性,英文简释,来源\n'+S.words.map(w=>[w.en,w.zh,w.pos,w.def,w.sources.join('|')].map(q).join(',')).join('\n'))}restoreFile.onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let x=JSON.parse(await f.text());if(!x.words||!x.events)throw 0;S=x;await save();toast('恢复完成');render()}catch{toast('备份文件无法读取')}};backupQuick.onclick=backupData;function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName)){if(current==='type'&&typing?.revealed&&e.key==='Enter'){e.preventDefault();typeNext()}return}if(current==='study'&&session){if(e.key==='1'){e.preventDefault();judge('good')}if(e.key==='2'){e.preventDefault();judge('bad')}if(e.key==='Enter'&&session.revealed){e.preventDefault();nextCard()}}if(current==='type'&&typing?.revealed){if(e.key==='1'){e.preventDefault();typeJudge('good')}if(e.key==='2'){e.preventDefault();typeJudge('bad')}if(e.key==='Enter'){e.preventDefault();typeNext()}}});speechSynthesis.onvoiceschanged=()=>{if(current==='settings')renderSettings()};load();
</script></body></html>
