<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f1e8"><title>听词</title><style>
:root{--bg:#f5f1e8;--paper:#fffdf9;--ink:#292a25;--muted:#7b7c74;--line:#ded9cf;--g:#4d765b;--gb:#e8f0e9;--r:#a65a51;--rb:#f6e8e5;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}button,input,textarea,select{font:inherit;color:inherit}.wrap{max-width:780px;margin:auto;padding:24px 16px 100px}.top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px}.ey{font-size:13px;color:var(--muted);letter-spacing:.14em}h1{font-size:32px;margin:4px 0}.soft{border:1px solid var(--line);background:#fffaf2;border-radius:14px;padding:10px 14px}.view{display:none}.view.on{display:block}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card{background:rgba(255,253,249,.92);border:1px solid rgba(90,80,65,.12);border-radius:22px;padding:20px;box-shadow:0 12px 34px rgba(58,51,40,.05)}.entry{min-height:150px;display:flex;flex-direction:column;justify-content:space-between}.entry h2{margin:0 0 8px;font-size:22px}.entry p,.small{color:var(--muted);line-height:1.6}.primary{border:0;background:var(--ink);color:white;border-radius:14px;padding:12px 18px;font-weight:650;align-self:flex-start}.stat{font-size:31px;font-weight:730}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.field{display:grid;gap:6px}.field label{font-size:13px;color:var(--muted)}input,textarea,select{border:1px solid var(--line);background:#fffefa;border-radius:13px;padding:12px;outline:0}textarea{width:100%;min-height:180px;line-height:1.65}.study{min-height:68vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative}.count{position:absolute;left:20px;top:18px;font-size:13px;color:var(--muted)}.retire{position:absolute;right:16px;top:13px;border:0;background:transparent;color:var(--muted)}.speaker{width:92px;height:92px;border:1px solid var(--line);background:#fffaf2;border-radius:50%;font-size:34px;margin-bottom:28px}.word{font-size:42px;font-weight:730;margin:0 0 12px}.word.good{color:var(--g)}.word.bad{color:var(--r)}.mean{font-size:23px;line-height:1.5}.meta,.hint{font-size:13px;color:var(--muted);margin-top:9px}.ex{margin-top:16px;line-height:1.6;color:#55574f}.judge{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:26px}.judge button{padding:17px 8px;border-radius:16px;font-size:18px;font-weight:700;border:1px solid}.goodb{background:var(--gb);color:var(--g);border-color:#bfd1c4!important}.badb{background:var(--rb);color:var(--r);border-color:#e1beb8!important}.nav{position:fixed;left:10px;right:10px;bottom:10px;max-width:760px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr);padding:7px;background:rgba(255,253,249,.96);border:1px solid rgba(100,90,75,.12);border-radius:20px;box-shadow:0 12px 34px rgba(58,51,40,.08);z-index:5}.nav button{border:0;background:transparent;padding:9px 2px;border-radius:13px}.nav button.on{background:#ebe7df;font-weight:700}.list{margin-top:14px}.item{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:12px 2px;border-bottom:1px solid rgba(80,75,65,.1)}.item b{font-size:18px}.tag{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:3px 7px;margin:2px;font-size:11px;color:var(--muted)}.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:#292b27;color:#fff;padding:9px 13px;border-radius:11px;display:none;z-index:10}@media(max-width:560px){.grid{grid-template-columns:1fr}.wrap{padding-top:20px}}
</style></head><body><div class="wrap"><header class="top"><div><div id="ey" class="ey">今日</div><h1 id="title">学习</h1></div><button id="backup" class="soft">备份</button></header><section id="home" class="view on"></section><section id="study" class="view"></section><section id="type" class="view"></section><section id="text" class="view"></section><section id="library" class="view"></section><section id="stats" class="view"></section></div><nav id="nav" class="nav"></nav><div id="toast" class="toast"></div><input id="restore" type="file" accept="application/json" hidden><script>
(function(){'use strict';
var K='listenwrite-v2',S={words:[],events:[],set:{newN:30,reviewN:80,rate:.92}},cur='home',sess=null,ts=null;function $(x){return document.getElementById(x)}function esc(x){return String(x==null?'':x).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function id(){return Date.now().toString(36)+Math.random().toString(36).slice(2)}function day(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}function save(){localStorage.setItem(K,JSON.stringify(S))}function load(){try{var x=localStorage.getItem(K);if(x)S=JSON.parse(x)}catch(e){}if(!S.words.length){[['distribution','分布；分配','n.','the way something is spread or shared'],['rural','乡村的；农村的','adj.','connected with the countryside'],['decline','下降；减少','n./v.','to become smaller, fewer or less'],['agriculture','农业','n.','the practice of farming'],['significant','显著的；重要的','adj.','large or important enough to be noticed']].forEach(function(x){add(x[0],x[1],'示例词库',x[2],x[3])});save()}}function toast(x){$('toast').textContent=x;$('toast').style.display='block';setTimeout(function(){$('toast').style.display='none'},1200)}
function add(en,zh,src,pos,def,ex){en=String(en||'').trim().toLowerCase();if(!en)return;var w=S.words.find(function(a){return a.en===en});if(!w){w={id:id(),en:en,zh:zh||'',pos:pos||'',def:def||'',src:[],ex:[],ret:false,next:0,int:0,diff:0};S.words.push(w)}if(zh&&!w.zh)w.zh=zh;if(src&&w.src.indexOf(src)<0)w.src.push(src);if(ex&&w.ex.indexOf(ex)<0)w.ex.push(ex);return w}function ev(w,mode,res){var d=day(),arr=S.events.filter(function(e){return e.wordId===w.id&&e.date===d}),cold=!arr.length;S.events.push({id:id(),wordId:w.id,date:d,ts:Date.now(),mode:mode,res:res,cold:cold});if(cold){if(res==='bad'){w.int=1;w.diff=(w.diff||0)+1}else{w.int=w.int?Math.min(180,Math.max(2,Math.round(w.int*2.1))):3;w.diff=Math.max(0,(w.diff||0)-.1)}w.next=Date.now()+w.int*86400000}else if(res==='bad')w.diff=(w.diff||0)+.15;save()}
function speak(t){if(!window.speechSynthesis)return toast('浏览器不支持朗读');speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=S.set.rate||.92;speechSynthesis.speak(u)}var N=[['home','今日','学习'],['type','手打','手打强化'],['text','文本','文本听力'],['library','词库','词库'],['stats','统计','统计']];function nav(){ $('nav').innerHTML=N.map(function(n){return'<button data-v="'+n[0]+'" class="'+(cur===n[0]?'on':'')+'">'+n[1]+'</button>'}).join('');document.querySelectorAll('[data-v]').forEach(function(b){b.onclick=function(){go(b.dataset.v)}})}function go(v){cur=v;document.querySelectorAll('.view').forEach(function(x){x.classList.remove('on')});$(v).classList.add('on');var n=N.find(function(a){return a[0]===v});$('ey').textContent=n?n[1]:'';$('title').textContent=n?n[2]:'';nav();render()}function render(){if(cur==='home')home();else if(cur==='study')study();else if(cur==='type')typeLanding();else if(cur==='text')textView();else if(cur==='library')lib();else stats()}
function home(){var d=day(),a=S.events.filter(function(e){return e.date===d}),g=new Set(a.filter(function(e){return e.res==='good'}).map(function(e){return e.wordId})).size,b=new Set(a.filter(function(e){return e.res==='bad'}).map(function(e){return e.wordId})).size;$('home').innerHTML='<div class="grid"><div class="card entry"><div><h2>今日学习</h2><p>只听声音判断。熟悉就毕业，不熟会在今天后面继续出现。</p></div><button id="start" class="primary">开始听词</button></div><div class="card entry"><div><h2>手打强化</h2><p>可按具体日期筛选当天的不熟词，再做主动中文提取。</p></div><button id="topen" class="primary">进入手打</button></div><div class="card"><div class="small">今天已毕业</div><div class="stat">'+g+'</div><div class="small">有过不熟 '+b+'</div></div><div class="card"><div class="small">词库总量</div><div class="stat">'+S.words.filter(function(w){return!w.ret}).length+'</div></div></div><div class="card" style="margin-top:14px"><h2 style="margin-top:0">今天学多少</h2><div class="row"><div class="field"><label>新词</label><input id="newN" type="number" value="'+S.set.newN+'"></div><div class="field"><label>复习</label><input id="revN" type="number" value="'+S.set.reviewN+'"></div></div><div class="small" style="margin-top:10px">当天第一次判断是主信号；后续不熟只做小幅困难加权。</div></div>';$('start').onclick=start;$('topen').onclick=function(){go('type')};$('newN').onchange=function(){S.set.newN=Math.max(0,+this.value||0);save()};$('revN').onchange=function(){S.set.reviewN=Math.max(0,+this.value||0);save()}}
function start(){var now=Date.now(),seen=new Set(S.events.filter(function(e){return e.cold}).map(function(e){return e.wordId})),r=S.words.filter(function(w){return!w.ret&&seen.has(w.id)&&(w.next||0)<=now}),f=S.words.filter(function(w){return!w.ret&&!seen.has(w.id)});r.sort(function(a,b){return(b.diff||0)-(a.diff||0)||(a.next||0)-(b.next||0)});f.sort(function(a,b){return(b.src.length-a.src.length)});var q=r.slice(0,S.set.reviewN).concat(f.slice(0,S.set.newN));if(!q.length)q=S.words.filter(function(w){return!w.ret}).slice(0,20);sess={q:q,i:0,show:false,res:null};cur='study';document.querySelectorAll('.view').forEach(function(x){x.classList.remove('on')});$('study').classList.add('on');$('ey').textContent='听音';$('title').textContent='今日学习';nav();study();if(q[0])setTimeout(function(){speak(q[0].en)},60)}function cw(){return sess&&sess.q[sess.i]}
function study(){var w=cw();if(!w){$('study').innerHTML='<div class="card" style="text-align:center;padding:45px">这轮结束了<br><br><button id="back" class="primary">回首页</button></div>';$('back').onclick=function(){go('home')};return}var mid=sess.show?'<div><div class="word '+(sess.res==='good'?'good':'bad')+'">'+esc(w.en)+'</div><div class="mean">'+esc(w.zh||'暂无中文释义')+'</div><div class="meta">'+esc(w.pos||'')+(w.def?' · '+esc(w.def):'')+'</div>'+(w.ex.length?'<div class="ex">'+esc(w.ex[w.ex.length-1])+'</div>':'')+'</div>':'<div class="small">听到以后，意思能不能直接出来？</div>';$('study').innerHTML='<div class="card study"><div class="count">'+(sess.i+1)+' / '+sess.q.length+'</div><button id="ret" class="retire">退出循环</button><button id="sp" class="speaker">◖))</button>'+mid+'<div class="judge"><button id="good" class="goodb">1　熟悉</button><button id="bad" class="badb">2　不熟悉</button></div><div class="hint">'+(sess.show?'再点 1/2 可修改 · Enter 下一词':'判断后自动显示答案')+'</div></div>';$('sp').onclick=function(){speak(w.en)};$('good').onclick=function(){judge('good')};$('bad').onclick=function(){judge('bad')};$('ret').onclick=function(){w.ret=true;save();next(true)}}function judge(r){var w=cw();if(!sess.show){sess.show=true;sess.res=r;ev(w,'listen',r)}else sess.res=r;study()}function next(skip){var w=cw();if(!skip&&sess.res==='bad')sess.q.push(w);sess.i++;sess.show=false;sess.res=null;study();var n=cw();if(n)setTimeout(function(){speak(n.en)},60)}
function typeLanding(){if(ts&&ts.active)return typeCard();$('type').innerHTML='<div class="card"><h2 style="margin-top:0">选择待强化词</h2><div class="row"><div class="field"><label>日期</label><input id="td" type="date" value="'+day()+'"></div><div class="field"><label>至少不熟几次</label><input id="tm" type="number" min="1" value="1"></div></div><br><button id="tb" class="primary">开始</button></div>';$('tb').onclick=function(){var d=$('td').value,m=Math.max(1,+$('tm').value||1),q=S.words.filter(function(w){return!w.ret&&S.events.filter(function(e){return e.wordId===w.id&&e.date===d&&e.res==='bad'}).length>=m});ts={active:true,q:q,i:0,show:false,res:null,input:''};typeCard();if(q[0])speak(q[0].en)}}function typeCard(){var w=ts.q[ts.i];if(!w){ts.active=false;$('type').innerHTML='<div class="card" style="text-align:center">这批强化完成了<br><br><button id="tr" class="primary">重新筛选</button></div>';$('tr').onclick=function(){ts=null;typeLanding()};return}if(!ts.show){$('type').innerHTML='<div class="card study"><div class="count">'+(ts.i+1)+' / '+ts.q.length+'</div><button id="tsp" class="speaker">◖))</button><div class="small">听音后写中文意思；不想写就空着按 Enter。</div><input id="ti" style="width:100%;font-size:21px;margin-top:18px" placeholder="输入中文意思…"></div>';$('tsp').onclick=function(){speak(w.en)};$('ti').focus();$('ti').onkeydown=function(e){if(e.key==='Enter'){ts.input=this.value.trim();ts.show=true;typeCard()}}}else{$('type').innerHTML='<div class="card study"><button id="tsp" class="speaker">◖))</button><div class="word '+(ts.res==='good'?'good':ts.res==='bad'?'bad':'')+'">'+esc(w.en)+'</div><div class="mean">'+esc(w.zh||'暂无中文释义')+'</div>'+(ts.input?'<div class="ex">你写的是：'+esc(ts.input)+'</div>':'')+'<div class="judge"><button id="tg" class="goodb">1　熟悉</button><button id="tb2" class="badb">2　不熟悉</button></div><div class="hint">判断后 Enter 下一词</div></div>';$('tsp').onclick=function(){speak(w.en)};$('tg').onclick=function(){ts.res='good';ev(w,'type','good');typeCard()};$('tb2').onclick=function(){ts.res='bad';ev(w,'type','bad');typeCard()}}}function typeNext(){if(!ts||!ts.show||!ts.res)return;var w=ts.q[ts.i];if(ts.res==='bad')ts.q.push(w);ts.i++;ts.show=false;ts.res=null;ts.input='';typeCard();var n=ts.q[ts.i];if(n)speak(n.en)}
function textView(){$('text').innerHTML='<div class="card"><h2 style="margin-top:0">文本听力</h2><textarea id="ta" placeholder="粘贴句子或剑雅 transcript…"></textarea><div class="row" style="margin-top:10px"><button id="pa" class="primary">播放全文</button><button id="ps" class="soft">播放选中</button><button id="as" class="soft">选中词加入词库</button></div><div class="row" style="margin-top:12px"><input id="book" value="文本词库" placeholder="词库名"><input id="zh" placeholder="中文释义，可留空"></div></div>';$('pa').onclick=function(){speak($('ta').value)};$('ps').onclick=function(){var a=$('ta');speak(a.value.slice(a.selectionStart,a.selectionEnd)||a.value)};$('as').onclick=function(){var a=$('ta'),x=a.value.slice(a.selectionStart,a.selectionEnd).trim().replace(/^[^A-Za-z'-]+|[^A-Za-z'-]+$/g,'');if(!x||/\s/.test(x))return toast('请只选中一个英文单词');add(x,$('zh').value.trim(),$('book').value.trim()||'文本词库','','');save();toast('已加入 '+x)}}
function lib(){var books=[];S.words.forEach(function(w){w.src.forEach(function(s){if(books.indexOf(s)<0)books.push(s)})});$('library').innerHTML='<div class="card"><h2 style="margin-top:0">导入词库</h2><div class="row"><input id="bn" value="我的词库"><input id="fi" type="file" accept=".csv,.txt,.tsv"><button id="im" class="primary">导入</button></div><div class="small" style="margin-top:8px">格式：英文,中文,词性,英文简释</div></div><div class="card" style="margin-top:14px"><div class="row"><b>词库 '+S.words.length+'</b><select id="bf"><option value="">全部来源</option>'+books.map(function(b){return'<option>'+esc(b)+'</option>'}).join('')+'</select></div><div id="wl" class="list"></div></div>';$('bf').onchange=draw;$('im').onclick=importF;draw()}function draw(){var f=$('bf').value,a=S.words.filter(function(w){return!f||w.src.indexOf(f)>=0});$('wl').innerHTML=a.map(function(w){return'<div class="item"><div><b>'+esc(w.en)+'</b><div class="small">'+esc(w.pos)+'</div></div><div>'+esc(w.zh||'—')+'<div>'+w.src.map(function(s){return'<span class="tag">'+esc(s)+'</span>'}).join('')+'</div></div></div>'}).join('')}function importF(){var f=$('fi').files[0];if(!f)return toast('先选文件');var r=new FileReader();r.onload=function(){var src=$('bn').value.trim()||'我的词库',lines=String(r.result).split(/\r?\n/).filter(Boolean),n=0;lines.forEach(function(line){var p=line.indexOf('\t')>=0?line.split('\t'):line.split(',');if(!p[0]||/^(word|english|单词)$/i.test(p[0].trim()))return;add(p[0],p[1]||'',src,p[2]||'',p[3]||'');n++});save();toast('已导入 '+n+' 行');lib()};r.readAsText(f)}
function stats(){var d={};S.events.forEach(function(e){d[e.date]=d[e.date]||{g:0,b:0,t:0};if(e.res==='good')d[e.date].g++;else d[e.date].b++;if(e.mode==='type')d[e.date].t++});var ks=Object.keys(d).sort().reverse();$('stats').innerHTML='<div class="grid"><div class="card"><div class="small">累计词数</div><div class="stat">'+S.words.length+'</div></div><div class="card"><div class="small">学习判断</div><div class="stat">'+S.events.length+'</div></div></div><div class="card" style="margin-top:14px">'+ks.map(function(k){return'<div class="item"><b>'+k+'</b><div>熟悉 '+d[k].g+' · 不熟 '+d[k].b+' · 手打 '+d[k].t+'</div></div>'}).join('')+'</div>'}
function dl(name,type,txt){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:type}));a.download=name;a.click()}function backup(){dl('listenwrite-'+day()+'.json','application/json',JSON.stringify(S,null,2))}$('backup').onclick=backup;window.addEventListener('keydown',function(e){var tag=document.activeElement&&document.activeElement.tagName;if(tag==='INPUT'||tag==='TEXTAREA'||tag==='SELECT')return;if(cur==='study'&&sess){if(e.key==='1')judge('good');if(e.key==='2')judge('bad');if(e.key==='Enter'&&sess.show)next(false)}if(cur==='type'&&ts&&ts.show){if(e.key==='1'){$('tg').click()}if(e.key==='2'){$('tb2').click()}if(e.key==='Enter')typeNext()}});load();nav();home();})();
</script></body></html>
