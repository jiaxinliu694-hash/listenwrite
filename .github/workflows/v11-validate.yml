name: Validate v11 hardening

on:
  push:
    branches: [v11-state-ux-hardening]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply v11 patch
        run: python scripts/v11_patch.py
      - name: Install
        run: npm install
      - name: Syntax check
        run: |
          node --check src/app.js
          node --check src/queue.js
          node --check src/typefilters.js
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit validated source and bundle
        run: |
          git config user.name "listenwrite-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/app.js src/queue.js src/typefilters.js tests/v11.test.js app.bundle.js
          if [ -z "$(git status --porcelain)" ]; then exit 0; fi
          git commit -m "Apply v11 state and UX hardening"
          git push
