name: Listenwrite v4 upgrade

on:
  push:
    branches: [studyday-v4]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply v4 source changes
        run: python3 scripts/apply_v4.py
      - name: Install
        run: npm install
      - name: Syntax checks
        run: |
          node --check src/app.js
          node --check src/storage.js
          node --check src/queue.js
          node --check src/studyday.js
          node --check src/tokenizer.js
      - name: Core and browser tests
        run: npm test
      - name: Build Safari bundle
        run: npm run build
      - name: Commit validated v4 output
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "listenwrite-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/app.js app.bundle.js
          git commit -m "Apply validated study-day v4 UI"
          git push
