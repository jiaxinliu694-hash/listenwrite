name: V23 Visible Timer

on:
  push:
    branches: [v23-visible-study-timer]

permissions:
  contents: write

jobs:
  patch-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 scripts/v23_timer_patch.py
      - run: npm install
      - run: npm test
      - run: npm run build
      - name: Commit final timer source
        run: |
          git config user.name "listenwrite-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm scripts/v23_timer_patch.py .github/workflows/v23-timer.yml
          git add src tests styles.css app.bundle.js
          git commit -m "Add visible study timers"
          git push
