name: Apply v15 plan fixes
on:
  push:
    branches: [v15-random-scope-review]
    paths:
      - tools/apply-v15.mjs
      - .github/workflows/apply-v15.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v15-random-scope-review
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node tools/apply-v15.mjs
      - run: node --check src/queue.js
      - run: node --check src/storage.js
      - run: node --check src/app.js
      - run: npm test
      - run: npm run build
      - name: Commit patched source and bundle
        run: |
          rm tools/apply-v15.mjs .github/workflows/apply-v15.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix random redraw, scope filtering, and wrong-word review classification"
          git push origin HEAD:v15-random-scope-review
