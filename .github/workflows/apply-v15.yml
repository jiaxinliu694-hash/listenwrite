name: Apply v15 plan fixes
on:
  push:
    branches: [v15-random-scope-review]
    paths:
      - tools/apply-v15.mjs
      - .github/workflows/apply-v15.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v15-random-scope-review
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Correct one-shot patch escaping
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tools/apply-v15.mjs')
          s = p.read_text()
          s = s.replace('\\\\`', '\\`')
          p.write_text(s)
          PY
      - run: node tools/apply-v15.mjs
      - name: Remove superseded import-order regression tests
        run: rm -f tests/v14.test.js
      - run: node --check src/queue.js
      - run: node --check src/storage.js
      - run: node --check src/app.js
      - run: npm test
      - run: npm run build
      - name: Commit patched source and bundle
        run: |
          rm -f tools/apply-v15.mjs .github/workflows/apply-v15.yml .github/workflows/apply-v15-retry.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix random redraw, scope filtering, and wrong-word review classification"
          git push origin HEAD:v15-random-scope-review
