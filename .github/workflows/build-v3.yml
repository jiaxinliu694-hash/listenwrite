name: Build Listenwrite v3

on:
  push:
    branches: [scheduler-v2-fsrs, main, v32-edit-text-word-status]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v32 patch
        if: github.ref_name == 'v32-edit-text-word-status'
        run: python scripts/apply-v32.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node --check src/app.js
      - run: node --check src/textlibrary.js
      - run: npm test
      - run: npm run build
      - name: Commit v32 source and browser bundle
        if: github.ref_name == 'v32-edit-text-word-status'
        run: |
          if [ -z "$(git status --porcelain -- src/app.js src/textlibrary.js tests/v23_1.test.js tests/v24.test.js tests/v32.test.js index.html app.bundle.js)" ]; then exit 0; fi
          git config user.name "listenwrite-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/app.js src/textlibrary.js tests/v23_1.test.js tests/v24.test.js tests/v32.test.js index.html app.bundle.js
          git commit -m "Enable text history status editing"
          git push
      - name: Commit browser bundle
        if: github.ref_name != 'v32-edit-text-word-status'
        run: |
          if [ -z "$(git status --porcelain -- app.bundle.js)" ]; then exit 0; fi
          git config user.name "listenwrite-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app.bundle.js
          git commit -m "Build browser bundle"
          git push
