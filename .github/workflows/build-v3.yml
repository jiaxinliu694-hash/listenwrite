name: Build Listenwrite v3

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Pack source for review
        run: zip -qr listenwrite-source.zip . -x '.git/*' 'node_modules/*' 'listenwrite-source.zip'
      - uses: actions/upload-artifact@v7
        with:
          name: listenwrite-source
          path: listenwrite-source.zip
          retention-days: 30
      - name: Commit browser build
        run: |
          if [ -z "$(git status --porcelain -- app.bundle.js index.html)" ]; then exit 0; fi
          git config user.name "listenwrite-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app.bundle.js index.html
          git commit -m "Build browser bundle [skip ci]"
          git push
