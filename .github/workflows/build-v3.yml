name: Build Listenwrite v3

on:
  push:
    branches: [scheduler-v2-fsrs, main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npm run build
      - name: Commit browser bundle
        run: |
          if [ -z "$(git status --porcelain -- app.bundle.js)" ]; then exit 0; fi
          git config user.name "listenwrite-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app.bundle.js
          git commit -m "Build browser bundle"
          git push
