name: Build Listenwrite v3

on:
  push:
    branches: [scheduler-v2-fsrs, main, v33-ios-data-recovery]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply v33 patch
        if: github.ref_name == 'v33-ios-data-recovery'
        run: python scripts/apply-v33.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node --check src/app.js
      - run: node --check src/storage.js
      - run: npm test
      - run: npm run build
      - name: Commit v33 source and browser bundle
        if: github.ref_name == 'v33-ios-data-recovery'
        run: |
          if [ -z "$(git status --porcelain -- src/app.js src/storage.js tests/v23_1.test.js tests/v24.test.js tests/v33.test.js index.html app.bundle.js)" ]; then exit 0; fi
          git config user.name "listenwrite-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/app.js src/storage.js tests/v23_1.test.js tests/v24.test.js tests/v33.test.js index.html app.bundle.js
          git commit -m "Expose local data recovery on iOS"
          git push
      - name: Commit browser bundle
        if: github.ref_name != 'v33-ios-data-recovery'
        run: |
          if [ -z "$(git status --porcelain -- app.bundle.js)" ]; then exit 0; fi
          git config user.name "listenwrite-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app.bundle.js
          git commit -m "Build browser bundle"
          git push
