name: Listenwrite v3 core

on:
  push:
    branches: [scheduler-v2-fsrs]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node --check src/app.js
      - run: node --check src/storage.js
      - run: node --check src/queue.js
      - run: npm test
