name: Apply v16 reinforcement changes
on:
  push:
    branches: [v16-reinforcement-steps]
    paths:
      - tools/apply-v16.mjs
      - tests/v16.test.js
      - src/reinforcement.js
      - .github/workflows/apply-v16.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v16-reinforcement-steps
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Remove optional status-line patch with nested template quoting
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tools/apply-v16.mjs')
          s=p.read_text()
          start=s.find("patch('src/app.js',\n`<div class=\"statusline\">")
          end=s.find("// Type mode keeps its old one-good completion semantics.")
          if start != -1 and end != -1:
              s=s[:start]+s[end:]
          p.write_text(s)
          PY
      - run: node tools/apply-v16.mjs
      - name: Align old queue tests with minimum-time reinforcement semantics
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('tests/core.test.js')
          s=p.read_text()
          start=s.find("test('retry reappears after other cards, not only at the end'")
          end=s.find("function wordBy(S,id)", start)
          if start != -1 and end != -1:
              s=s[:start]+s[end:]
          p.write_text(s)

          p=Path('tests/v11.test.js')
          s=p.read_text().replace("assert.equal(session.retry[0].eligibleTurn, 3);", "assert.equal(session.retry[0].eligibleAt, 31000);")
          s=s.replace("retry: [{ wordId: 'w1', attempt: 1, eligibleTurn: 0, addedAt: 1 }]", "retry: [{ wordId: 'w1', attempt: 1, eligibleAt: 0, addedAt: 1 }]")
          p.write_text(s)

          p=Path('tests/v6.test.js')
          s=p.read_text().replace("assert.equal(pickNext(session), retryWord.id, 'due retry remains higher priority than resume hint');", "assert.equal(pickNext(session), plan.resumeWordId, 'a retry inside its minimum interval must not jump ahead of the resume word');")
          p.write_text(s)
          PY
      - run: node --check src/reinforcement.js
      - run: node --check src/queue.js
      - run: node --check src/engine.js
      - run: node --check src/app.js
      - run: npm test
      - run: npm run build
      - name: Commit patched source and bundle
        run: |
          rm -f tools/apply-v16.mjs .github/workflows/apply-v16.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add three-step same-day reinforcement and preserve target progress"
          git push origin HEAD:v16-reinforcement-steps
