name: One-time immediate Enter audio patch

on:
  push:
    branches: [v40-enter-immediate-audio]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v40-enter-immediate-audio
      - name: Patch type Enter advance audio
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/app.js')
          s=p.read_text()
          old="function nextType(){ if(!typeRun.result)return; finishCurrent(typeRun.session,typeRun.result,state); typeRun.answer=false;typeRun.input='';typeRun.currentEventId=null;typeRun.result=null;touchActivity(typeRun.activityId);if(!pickNext(typeRun.session))finishType();else{renderTypeRun();speak(wordById(typeRun.session.current.wordId).en);} }"
          new="function nextType(){ if(!typeRun.result)return; finishCurrent(typeRun.session,typeRun.result,state); typeRun.answer=false;typeRun.input='';typeRun.currentEventId=null;typeRun.result=null;touchActivity(typeRun.activityId);if(!pickNext(typeRun.session))finishType();else{const nextWord=wordById(typeRun.session.current.wordId);if(nextWord)speak(nextWord.en);renderTypeRun();} }"
          assert old in s, 'nextType signature changed'
          s=s.replace(old,new,1)
          old2="else if(typeRun&&typeRun.answer){if(e.key==='1')judgeType('good');else if(e.key==='2')judgeType('bad');else if(e.key==='Enter'&&typeRun.result)nextType();}"
          new2="else if(typeRun&&typeRun.answer){if(e.key==='1')judgeType('good');else if(e.key==='2')judgeType('bad');else if(e.key==='Enter'&&typeRun.result){e.preventDefault();nextType();}}"
          assert old2 in s, 'type key handler changed'
          s=s.replace(old2,new2,1)
          p.write_text(s)
          Path('tests/type-enter-audio-v40.test.js').write_text("""import test from 'node:test';\nimport assert from 'node:assert/strict';\nimport fs from 'node:fs';\n\ntest('Enter advances type study without browser default action',()=>{\n  const app=fs.readFileSync(new URL('../src/app.js',import.meta.url),'utf8');\n  assert.ok(app.includes(\"e.key==='Enter'&&typeRun.result){e.preventDefault();nextType();}\"));\n});\n\ntest('next type word is queued for speech before rerender',()=>{\n  const app=fs.readFileSync(new URL('../src/app.js',import.meta.url),'utf8');\n  const start=app.indexOf('function nextType(){');\n  const end=app.indexOf('function finishType(){',start);\n  const body=app.slice(start,end);\n  assert.ok(body.indexOf('speak(nextWord.en)') < body.indexOf('renderTypeRun()'));\n});\n""")
          PY
          node --check src/app.js
          node --test tests/type-enter-audio-v40.test.js
      - name: Commit source changes
        run: |
          git config user.name "listenwrite-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/app.js tests/type-enter-audio-v40.test.js
          git commit -m "Play next type word immediately on Enter"
          git push origin HEAD:v40-enter-immediate-audio
