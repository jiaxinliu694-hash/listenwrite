name: Apply v21 sticky wordbook picker
on:
  push:
    branches: [v21-sticky-wordbook-panel]
    paths:
      - 'tools/apply-v21.mjs'
      - '.github/workflows/apply-v21.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node tools/apply-v21.mjs
      - run: node --check src/app.js
      - run: npm test
      - run: npm run build
      - name: Commit UX fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/app.js styles.css app.bundle.js tests/v19.test.js tests/v21.test.js
          git rm .github/workflows/apply-v21.yml tools/apply-v21.mjs
          git commit -m "Keep wordbook picker open while selecting" || exit 0
          git push
