name: Validate v13 use polish

on:
  push:
    branches: [v13-use-polish]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply v13 patch
        run: python scripts/v13_patch.py
      - name: Install
        run: npm install
      - name: Syntax check
        run: |
          node --check src/app.js
          node --check src/usepolish.js
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit validated source and bundle
        run: |
          git config user.name "listenwrite-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/app.js src/usepolish.js tests/v13.test.js app.bundle.js
          if [ -z "$(git status --porcelain)" ]; then exit 0; fi
          git commit -m "Polish free listening and sentence maintenance"
          git push
