name: Upgrade learning statistics

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run statistics patch
        run: python3 scripts/patch_stats.py
      - name: Commit upgrade
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "listenwrite-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Upgrade learning statistics and drilldowns"
          git push
