name: Upgrade Listenwrite UI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upgrade statistics
        run: python3 scripts/patch_stats.py
      - name: Upgrade immersive study page
        run: python3 scripts/patch_focus.py
      - name: Upgrade hand-writing reinforcement
        run: python3 scripts/patch_hand.py
      - name: Upgrade persistent text library
        run: python3 scripts/patch_text_library.py
      - name: Commit upgrade
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "listenwrite-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Upgrade persistent text library"
          git push
