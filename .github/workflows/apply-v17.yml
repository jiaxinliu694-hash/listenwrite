name: Apply v17 wordbook deletion
on:
  push:
    branches: [v17-delete-wordbook]
    paths:
      - tools/apply-v17.mjs
      - tests/v17.test.js
      - src/wordadmin.js
      - .github/workflows/apply-v17.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v17-delete-wordbook
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node tools/apply-v17.mjs
      - run: node --check src/app.js
      - run: node --check src/wordadmin.js
      - run: npm test
      - run: npm run build
      - name: Commit patched source and bundle
        run: |
          rm -f tools/apply-v17.mjs .github/workflows/apply-v17.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add safe wordbook deletion with optional history purge"
          git push origin HEAD:v17-delete-wordbook
