name: Validate v12 real-use flow

on:
  push:
    branches: [v12-real-use-flow]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply v12 patch
        run: python scripts/v12_patch.py
      - name: Install
        run: npm install
      - name: Syntax check
        run: |
          node --check src/app.js
          node --check src/tokenizer.js
          node --check src/importwords.js
          node --check src/wordadmin.js
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit validated source and bundle
        run: |
          git config user.name "listenwrite-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/app.js src/tokenizer.js src/importwords.js src/wordadmin.js tests/v12.test.js app.bundle.js
          if [ -z "$(git status --porcelain)" ]; then exit 0; fi
          git commit -m "Apply v12 real-use flow improvements"
          git push
