name: Cleanup v15 generated dependencies
on:
  push:
    branches: [v15-random-scope-review]
    paths:
      - .github/workflows/cleanup-v15.yml
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v15-random-scope-review
      - name: Remove generated dependencies and add ignore rule
        run: |
          git rm -r node_modules
          printf "node_modules/\n" > .gitignore
          rm .github/workflows/cleanup-v15.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove generated node_modules from repository"
          git push origin HEAD:v15-random-scope-review
