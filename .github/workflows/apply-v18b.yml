name: Apply v18b integrated identity fix
on:
  push:
    branches: [v18-cross-book-review-scope]
    paths:
      - 'tools/apply-v18b.mjs'
      - '.github/workflows/apply-v18b.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node tools/apply-v18b.mjs
      - run: node --check src/studyidentity.js
      - run: node --check src/queue.js
      - run: node --check src/typefilters.js
      - run: node --check src/app.js
      - run: npm test
      - run: npm run build
      - name: Commit integrated fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/studyidentity.js src/queue.js src/typefilters.js src/app.js tests/v18.test.js app.bundle.js
          git rm .github/workflows/apply-v18b.yml tools/apply-v18b.mjs
          git commit -m "Align cross-book identity across queue UI and typing" || exit 0
          git push
