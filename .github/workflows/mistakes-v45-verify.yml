name: Verify daily and per-book mistake review v45
on:
  push:
    branches: [feat/daily-book-mistakes-v45]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mistakes-v45
  cancel-in-progress: false
jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Finalize per-book failure attribution
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/mistakes.js')
          s = p.read_text()
          old = """    if (!groups.has(key)) groups.set(key, []);
              groups.get(key).push(row);
          """
          new = """    if (!groups.has(key)) groups.set(key, []);
              // Membership can change between two failures on the same day. A book's
              // error count includes only failures actually attributed to that book.
              const failures = by === 'book'
                ? row.failures.filter(event => eventBooks(event, row.word).includes(key)) : row.failures;
              if (!failures.length) continue;
              groups.get(key).push(failures.length === row.failures.length ? row
                : describeRow({ date: row.date, wordId: row.wordId, failures }, row.word, row.latestEvents));
          """
          if s.count(old) != 1:
              raise SystemExit('Book subtotal anchor changed')
          p.write_text(s.replace(old, new, 1))
          PY
      - run: npm ci
      - name: Validate new modules and all regression tests
        run: |
          node --check src/mistakes.js
          node --check src/mistakes-ui.js
          npm run check
      - run: npm run build
      - name: Recheck built state and whitespace
        run: |
          npm test
          git diff --check
      - name: Commit verified feature and browser bundle
        run: |
          git config user.name 'listenwrite-feature-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src tests mistakes.css index.html app.bundle.js
          git commit -m 'Keep per-book error subtotals accurate when membership changes'
          git push origin "HEAD:${GITHUB_REF_NAME}"
