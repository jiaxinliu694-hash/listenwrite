name: Apply Today scope history recovery fix v2

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix-preserve-today-scope-history'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-preserve-today-scope-history
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Execute Today recovery patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          workflow = Path('.github/workflows/fix-today-scope-history-once.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          code = textwrap.dedent(workflow[start:end])

          block_start = code.index('old_rows = """')
          block_end_marker = 'a = a.replace(old_rows, new_rows, 1)'
          block_end = code.index(block_end_marker, block_start) + len(block_end_marker)
          resilient = '''old_rows_head = "    : (books.length ? books : allBooks(state)).map((b) => {"
          new_rows_head = "    : allBooks(state).map((b) => {"
          assert old_rows_head in a, 'mixed Today book rows changed unexpectedly'
          a = a.replace(old_rows_head, new_rows_head, 1)'''
          code = code[:block_start] + resilient + code[block_end:]
          exec(compile(code, 'today-scope-patch.py', 'exec'))
          PY
      - name: Validate full app
        run: |
          node --check src/queue.js
          node --check src/app.js
          node --test tests/v15.test.js tests/v18.test.js tests/today-scope-recovery-v42.test.js
          npm test
          npm run build
          git restore app.bundle.js index.html
      - name: Commit patch
        run: |
          git config user.name "listenwrite-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/queue.js src/app.js tests/v15.test.js tests/v18.test.js tests/today-scope-recovery-v42.test.js
          git commit -m "Preserve Today progress across wordbook switches"
          git push origin HEAD:fix-preserve-today-scope-history
