name: Verify and build word-text repair v44
on:
  push:
    branches: [fix/word-text-cleanup-v44]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: wordtext-v44
  cancel-in-progress: false
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Apply checked integration edits
        run: python3 .maintenance/apply-wordtext-v44.py
      - run: npm ci
      - name: Full regression suite
        run: npm run check
      - run: npm run build
      - name: Recheck built state and whitespace
        run: |
          npm test
          git diff --check
      - name: Commit verified source and browser bundle
        run: |
          git config user.name 'listenwrite-repair-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src tests app.bundle.js index.html
          git commit -m 'Repair imported word markers without resetting learning history'
          git push origin "HEAD:${GITHUB_REF_NAME}"
