name: V24 Daily Module Timers
on:
  push:
    branches: [v24-daily-module-timers]
permissions:
  contents: write
jobs:
  patch-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v24-daily-module-timers
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: python3 scripts/v24_daily_module_timer.py
      - run: npm install
      - run: npm test
      - run: npm run build
      - name: Commit daily module timer source
        run: |
          rm scripts/v24_daily_module_timer.py
          rm .github/workflows/v24-daily-module-timers.yml
          git config user.name "listenwrite-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Show daily cumulative module timers"
          git push origin HEAD:v24-daily-module-timers
