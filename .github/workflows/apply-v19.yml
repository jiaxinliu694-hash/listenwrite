name: Apply v19 integrated study flow
on:
  push:
    branches: [v19-gap-reinforcement-batch-meaning]
    paths:
      - 'tools/apply-v19.mjs'
      - '.github/workflows/apply-v19.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node tools/apply-v19.mjs
      - run: node --check src/reinforcement.js
      - run: node --check src/queue.js
      - run: node --check src/tokenizer.js
      - run: node --check src/storage.js
      - run: node --check src/app.js
      - run: npm test
      - run: npm run build
      - name: Commit v19 source and bundle
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/reinforcement.js src/queue.js src/tokenizer.js src/storage.js src/app.js src/wordadmin.js tests/v16.test.js tests/v19.test.js app.bundle.js
          git rm .github/workflows/apply-v19.yml tools/apply-v19.mjs
          git commit -m "Unify 3-step reinforcement and polish study flow" || exit 0
          git push
