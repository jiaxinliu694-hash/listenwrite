name: Listenwrite v7 sentence review

on:
  push:
    branches: [sentence-review-v7]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply v7 UI changes
        run: |
          python3 scripts/apply_v7.py
          python3 scripts/finalize_v7.py
      - name: Install
        run: npm install
      - name: Syntax checks
        run: |
          node --check src/app.js
          node --check src/storage.js
          node --check src/sentencebooks.js
          node --check src/queue.js
          node --check src/studyday.js
      - name: Core and browser tests
        run: npm test
      - name: Build Safari bundle
        run: npm run build
      - name: Commit validated v7 output
        run: |
          git config user.name "listenwrite-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/app.js app.bundle.js package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Apply validated sentence review v7"
          git push
