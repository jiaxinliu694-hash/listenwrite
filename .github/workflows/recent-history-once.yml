name: One-time recent history patch

on:
  push:
    branches: [v39-recent-study-history]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v39-recent-study-history
      - name: Add recent study history and previous-word correction
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('.')
          p=root/'src/app.js'; s=p.read_text()
          old="import { linkedTextEntries, textPracticeWords, textUnfamiliarTokens, textLegacyUnfamiliarCandidates, setTextLexemeStatus, textCollectionUnfamiliarTokens, textCollectionSummaries } from './textlibrary.js';\n"
          s=s.replace(old,old+"import { recentStudyDates, recentListeningRows, recentListeningStatus } from './recenthistory.js';\n",1)
          s=s.replace("  text: ['文本', '文本库'], datachart: ['数据图', '数据图'], library: ['词库', '词库'], stats: ['统计', '学习统计'],\n","  text: ['文本', '文本库'], datachart: ['数据图', '数据图'], library: ['词库', '词库'], recent: ['记录', '近 3 天学习记录'], stats: ['统计', '学习统计'],\n",1)
          s=s.replace('<button id="goStats" class="entry"><b>学习统计</b><span>日历、首轮结果、困难词和复习预测。</span></button></div></div>`);','<button id="goRecent" class="entry"><b>近 3 天学习记录</b><span>查看每天听过的词和当前状态，误判可以直接改。</span></button><button id="goStats" class="entry"><b>学习统计</b><span>日历、首轮结果、困难词和复习预测。</span></button></div></div>`);',1)
          s=s.replace("  document.getElementById('goDataChart').onclick = () => go('datachart');\n  document.getElementById('goStats').onclick = () => go('stats');\n","  document.getElementById('goDataChart').onclick = () => go('datachart');\n  document.getElementById('goRecent').onclick = () => go('recent');\n  document.getElementById('goStats').onclick = () => go('stats');\n",1)
          old='<div class="judges"><button id="judgeGood" class="goodbtn">1　熟悉</button><button id="judgeBad" class="badbtn">2　不熟悉</button></div>${answer ? `<div class="move"><button id="prevWord" class="soft" ${listen.session.history.length ? \'\' : \'disabled\'}>上一词</button><button id="nextWord" class="primary">${reviewing ? \'回到当前词\' : \'下一词\'}</button></div>` : \'\'}${gapNotice}'
          new='<div class="judges"><button id="judgeGood" class="goodbtn">1　熟悉</button><button id="judgeBad" class="badbtn">2　不熟悉</button></div>${(answer || listen.session.history.length) ? `<div class="move"><button id="prevWord" class="soft" ${listen.session.history.length ? \'\' : \'disabled\'}>上一词</button>${answer ? `<button id="nextWord" class="primary">${reviewing ? \'回到当前词\' : \'下一词\'}</button>` : \'\'}</div>` : \'\'}${gapNotice}'
          assert old in s
          s=s.replace(old,new,1)
          old="  mountStudyTimer(listen.activityId); document.getElementById('judgeGood').onclick = () => judgeListen('good'); document.getElementById('judgeBad').onclick = () => judgeListen('bad');\n  if (answer) { document.getElementById('prevWord').onclick = () => showPreviousListen(); document.getElementById('nextWord').onclick = () => reviewing ? returnFromHistory() : nextListen(); }\n"
          new="  mountStudyTimer(listen.activityId); document.getElementById('judgeGood').onclick = () => judgeListen('good'); document.getElementById('judgeBad').onclick = () => judgeListen('bad');\n  if (document.getElementById('prevWord')) document.getElementById('prevWord').onclick = () => showPreviousListen();\n  if (document.getElementById('nextWord')) document.getElementById('nextWord').onclick = () => reviewing ? returnFromHistory() : nextListen();\n"
          assert old in s
          s=s.replace(old,new,1)
          marker="function renderStats(){"
          recent=r'''function recentAttemptTime(ts){
            const d=new Date(Number(ts)||0),local=new Date(d.getTime()+8*3600000);
            return `${String(local.getUTCHours()).padStart(2,'0')}:${String(local.getUTCMinutes()).padStart(2,'0')}`;
          }
          function renderRecentStudy(){
            const dates=recentStudyDates(currentDayKey(),3);
            const sections=dates.map((date,index)=>{
              const rows=recentListeningRows(state,date),title=index===0?'今天':index===1?'昨天':date;
              const body=rows.map(({word,events})=>{
                const st=recentListeningStatus(word,events),first=events[0],last=events.at(-1);
                const attempts=events.map((event,i)=>`<div class="bookrow"><span>${i===0?'首轮':`第 ${i+1} 次`} · ${recentAttemptTime(event.ts)}</span><span class="${event.result==='good'?'good':'bad'}">${event.result==='good'?'熟悉':'不熟悉'}</span><span class="row"><button class="ghost" data-recent-event="${event.id}" data-result="good" ${event.result==='good'?'disabled':''}>改熟悉</button><button class="ghost" data-recent-event="${event.id}" data-result="bad" ${event.result==='bad'?'disabled':''}>改不熟</button></span></div>`).join('');
                return `<div class="listitem"><div class="space"><div><div class="word-main"><b>${esc(word.en)}</b><span class="word-meaning">${esc(word.zh||'')}</span></div><div class="small">首轮 ${first?.result==='good'?'熟悉':'不熟'} · 最近 ${last?.result==='good'?'熟悉':'不熟'} · 共 ${events.length} 次判断</div></div><span class="${st.cls}">${esc(st.label)}</span></div><details class="details" style="margin-top:8px"><summary>修改这一天的判断记录</summary><div style="margin-top:8px">${attempts}</div></details></div>`;
              }).join('');
              return `<section class="card"><div class="space"><div><h2 class="section-title">${esc(title)} · ${date}</h2><div class="small">${rows.length} 个正式听词单词 · 手打不混入这里</div></div></div><div class="list" style="margin-top:10px">${body||'<div class="empty">这一天还没有正式听词记录。</div>'}</div></section>`;
            }).join('');
            shell(`<div class="stack"><section class="card hero"><div class="space"><div><h2>近 3 天学习记录</h2><p>按学习日看正式听词状态。误点后可以直接改某一次“熟悉 / 不熟悉”；首轮被修改时会重建该词 FSRS，统计和当天强化状态也会随之重算。</p></div><button id="recentBack" class="soft">返回首页</button></div></section>${sections}</div>`);
            document.getElementById('recentBack').onclick=()=>go('home');
            document.querySelectorAll('[data-recent-event]').forEach(button=>button.onclick=()=>{
              const event=state.events.find(item=>item.id===button.dataset.recentEvent);
              if(!event||event.mode!=='listen'||!dates.includes(event.date))return toast('这条记录已不在可修改范围');
              editAttempt(state,event.id,button.dataset.result);persist();toast('状态已改，相关统计和复习状态已重算');renderRecentStudy();
            });
          }

          '''
          assert marker in s
          s=s.replace(marker,recent+marker,1)
          s=s.replace("else if(view==='library')renderLibrary();else renderStats();","else if(view==='library')renderLibrary();else if(view==='recent')renderRecentStudy();else renderStats();",1)
          p.write_text(s)
          (root/'src/recenthistory.js').write_text("""import { addStudyDays } from './studyday.js';
          import { reinforcementState, reinforcementLabel } from './reinforcement.js';

          export function recentStudyDates(today, count = 3) {
            const n = Math.max(1, Number(count) || 1);
            return Array.from({ length: n }, (_, index) => addStudyDays(today, -index));
          }
          export function recentListeningRows(state, date) {
            const events = (state?.events || []).filter((event) => event?.mode === 'listen' && event.date === date).sort((a,b)=>Number(a.ts||0)-Number(b.ts||0));
            const groups = new Map();
            for (const event of events) { if (!groups.has(event.wordId)) groups.set(event.wordId, []); groups.get(event.wordId).push(event); }
            return [...groups.entries()].map(([wordId,wordEvents])=>({word:(state.words||[]).find(word=>word.id===wordId),events:wordEvents})).filter(row=>row.word).sort((a,b)=>Number(b.events.at(-1)?.ts||0)-Number(a.events.at(-1)?.ts||0));
          }
          export function recentListeningStatus(word, events = []) {
            if (word?.retired) return { label: '简单', cls: 'mark-simple', passed: true };
            const status = reinforcementState(events);
            if (!status.started) return { label: '未开始', cls: 'mark-pending', passed: false };
            if (status.passed) return { label: '已熟悉', cls: 'mark-good', passed: true };
            return { label: reinforcementLabel(events), cls: 'mark-bad', passed: false };
          }
          """)
          (root/'tests/recent-history-v39.test.js').write_text("""import test from 'node:test';
          import assert from 'node:assert/strict';
          import { recentStudyDates, recentListeningRows, recentListeningStatus } from '../src/recenthistory.js';
          test('recent study entry covers three study days',()=>assert.deepEqual(recentStudyDates('2026-08-17',3),['2026-08-17','2026-08-16','2026-08-15']));
          test('rows include only formal listening',()=>{const state={words:[{id:'a'},{id:'b'}],events:[{id:'1',wordId:'a',date:'2026-08-17',mode:'listen',result:'good',ts:10},{id:'2',wordId:'b',date:'2026-08-17',mode:'type',result:'bad',ts:50},{id:'3',wordId:'b',date:'2026-08-17',mode:'listen',result:'bad',ts:20}]};assert.deepEqual(recentListeningRows(state,'2026-08-17').map(x=>x.word.id),['b','a']);});
          test('status uses the same 3-good reinforcement rule',()=>{const word={id:'a',retired:false},events=[{result:'bad',ts:1},{result:'good',ts:2},{result:'good',ts:3}];assert.equal(recentListeningStatus(word,events).label,'巩固 2/3');events.push({result:'good',ts:4});assert.equal(recentListeningStatus(word,events).label,'已熟悉');});
          """)
          PY
          node --check src/app.js
          node --check src/recenthistory.js
          node --test tests/recent-history-v39.test.js
      - name: Commit source changes
        run: |
          git config user.name "listenwrite-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/app.js src/recenthistory.js tests/recent-history-v39.test.js
          git commit -m "Add editable recent study history"
          git push origin HEAD:v39-recent-study-history
