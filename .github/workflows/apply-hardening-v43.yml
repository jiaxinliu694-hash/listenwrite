name: Apply Listenwrite hardening v43

on:
  push:
    branches: [fix/listenwrite-hardening-v43]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Reconstruct and adapt updater
        shell: bash
        run: |
          cat .hardening-v43/part-*.b64 | base64 --decode | gunzip > /tmp/apply-hardening-v43.mjs
          actual="$(sha256sum /tmp/apply-hardening-v43.mjs | cut -d' ' -f1)"
          expected="f4097cd9bf5799bec2677b17d23ab3fd6836e8fab779d1ed1d04fc970cf31794"
          test "$actual" = "$expected"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/apply-hardening-v43.mjs')
          s = p.read_text()
          anchor = "function target(file) {"
          helper = r"""
          // The checked-in baseline has identical code with extra blank lines in
          // a few modules. Exact matching remains first; this fallback accepts a
          // unique whitespace-only match and replaces only that source span.
          function whitespaceInsensitiveSpans(haystack, needle) {
            const compactNeedle = String(needle).replace(/\s+/g, '');
            if (!compactNeedle) return [];
            let compactHaystack = '';
            const sourceOffsets = [];
            for (let index = 0; index < haystack.length; index += 1) {
              if (/\s/.test(haystack[index])) continue;
              sourceOffsets.push(index);
              compactHaystack += haystack[index];
            }
            const spans = [];
            let cursor = 0;
            while ((cursor = compactHaystack.indexOf(compactNeedle, cursor)) >= 0) {
              spans.push({ start: sourceOffsets[cursor], end: sourceOffsets[cursor + compactNeedle.length - 1] + 1 });
              cursor += compactNeedle.length;
            }
            return spans;
          }
          """
          if s.count(anchor) != 1:
              raise SystemExit('updater helper anchor changed')
          s = s.replace(anchor, helper + anchor, 1)
          old = r"""  const oldCount = occurrences(current, from);
            const newCount = occurrences(current, to);

            if (oldCount === 1) {
              staged.set(edit.file, current.replace(from, () => to));
              reports.push(`修改  ${edit.file} — ${edit.label}`);
            } else if (oldCount === 0 && newCount === 1) {
              staged.set(edit.file, current);
              reports.push(`已有  ${edit.file} — ${edit.label}`);
            } else {
              throw new Error(
                `无法安全应用“${edit.label}”到 ${edit.file}：旧片段 ${oldCount} 处，新片段 ${newCount} 处。`
                + `\n目标基线：${TARGET_BASE}。预检阶段已停止，尚未写入任何文件。`
              );
            }
          """
          new = r"""  const oldCount = occurrences(current, from);
            const newCount = occurrences(current, to);
            const oldLoose = oldCount ? [] : whitespaceInsensitiveSpans(current, from);
            const newLoose = newCount ? [] : whitespaceInsensitiveSpans(current, to);

            if (oldCount === 1) {
              staged.set(edit.file, current.replace(from, () => to));
              reports.push(`修改  ${edit.file} — ${edit.label}`);
            } else if (oldCount === 0 && newCount === 1) {
              staged.set(edit.file, current);
              reports.push(`已有  ${edit.file} — ${edit.label}`);
            } else if (oldCount === 0 && newCount === 0 && oldLoose.length === 1 && newLoose.length === 0) {
              const [{ start, end }] = oldLoose;
              staged.set(edit.file, `${current.slice(0, start)}${to}${current.slice(end)}`);
              reports.push(`修改  ${edit.file} — ${edit.label}（仅格式差异）`);
            } else if (oldCount === 0 && newCount === 0 && oldLoose.length === 0 && newLoose.length === 1) {
              staged.set(edit.file, current);
              reports.push(`已有  ${edit.file} — ${edit.label}（仅格式差异）`);
            } else {
              throw new Error(
                `无法安全应用“${edit.label}”到 ${edit.file}：旧片段 ${oldCount} 处，新片段 ${newCount} 处，`
                + `忽略空白后的旧片段 ${oldLoose.length} 处、新片段 ${newLoose.length} 处。`
                + `\n目标基线：${TARGET_BASE}。预检阶段已停止，尚未写入任何文件。`
              );
            }
          """
          if s.count(old) != 1:
              raise SystemExit('updater match block changed')
          s = s.replace(old, new, 1)
          legacy_guard_old = "const heardOnPlanDay = (id) => events.some((event) =>"
          legacy_guard_new = "const heardOnPlanDay = (id) => Boolean(plan.date) && events.some((event) =>"
          if s.count(legacy_guard_old) != 1:
              raise SystemExit('wordbook carry guard anchor changed')
          s = s.replace(legacy_guard_old, legacy_guard_new, 1)
          p.write_text(s)
          PY
          node --check /tmp/apply-hardening-v43.mjs
      - name: Preflight source baseline
        run: node /tmp/apply-hardening-v43.mjs --check
      - name: Apply, test, and build
        run: node /tmp/apply-hardening-v43.mjs --verify
      - name: Remove one-time staging files
        shell: bash
        run: |
          rm -rf .hardening-v43 .listenwrite-hardening-backup-v43-*
          rm -f .github/workflows/apply-hardening-v43.yml
          python3 - <<'PY'
          from pathlib import Path
          for name in ('src/cloudmerge.js', 'src/tokenizer.js', 'src/wordadmin.js'):
              path = Path(name)
              path.write_text(path.read_text().rstrip() + '\n')
          PY
      - name: Commit verified changes
        shell: bash
        run: |
          git config user.name "listenwrite-hardening-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Harden cloud sync, storage, daily plans, and CI"
          git push origin "HEAD:${GITHUB_REF_NAME}"
