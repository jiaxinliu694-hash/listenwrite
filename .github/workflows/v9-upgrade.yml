name: Listenwrite sentence engine v9

on:
  push:
    branches: [sentence-engine-v9]

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sentence-engine-v9
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply v9 changes
        run: python3 scripts/apply_v9.py
      - name: Install
        run: npm install
      - name: Syntax checks
        run: |
          node --check src/textsentences.js
          node --check src/sentencebooks.js
          node --check src/storage.js
          node --check src/app.js
      - name: Core and browser tests
        run: npm test
      - name: Build Safari bundle
        run: npm run build
      - name: Commit validated v9 output
        run: |
          git config user.name "listenwrite-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/app.js src/storage.js src/sentencebooks.js src/textsentences.js styles.css app.bundle.js tests
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Apply validated sentence engine v9"
            git push origin sentence-engine-v9
          fi
