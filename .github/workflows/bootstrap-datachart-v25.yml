name: Bootstrap data-chart v25

on:
  push:
    branches: [v25-data-chart]

permissions:
  contents: write

jobs:
  generate:
    if: github.event.head_commit.message == 'Bootstrap data-chart v25'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v25-data-chart
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rebuild staged payload
        run: |
          set -euo pipefail
          cat tmp/datachart-v25/chunk_* > /tmp/datachart-payload.b64
          base64 -d /tmp/datachart-payload.b64 > /tmp/datachart-payload.tgz
          echo '8ba7175c6be3265bd8294313975e8d8b3085247875d7dda2102d4030ad460e8f  /tmp/datachart-payload.tgz' | sha256sum -c -
          mkdir -p /tmp/datachart-payload scripts tests src
          tar -xzf /tmp/datachart-payload.tgz -C /tmp/datachart-payload
          cp /tmp/datachart-payload/datachart-seed.min.js src/datachart-seed.js
          cp /tmp/datachart-payload/datachart-ui.js src/datachart-ui.js
          cp /tmp/datachart-payload/datachart.css datachart.css
          cp /tmp/datachart-payload/datachart.test.js tests/datachart-v25.test.js
          cp /tmp/datachart-payload/v25-browser.test.js tests/datachart-browser-v25.test.js
          cp /tmp/datachart-payload/apply-datachart-patch.mjs scripts/apply-datachart-v25.mjs
          node scripts/apply-datachart-v25.mjs
      - name: Validate and build
        run: |
          set -o pipefail
          {
            npm install
            node --check src/datachart.js
            node --check src/datachart-ui.js
            node --check src/datachart-seed.js
            npm test
            npm run build
          } 2>&1 | tee datachart-validation.log
      - name: Upload validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: datachart-validation
          path: datachart-validation.log
      - name: Commit generated module
        run: |
          set -euo pipefail
          rm -rf tmp/datachart-v25 scripts/apply-datachart-v25.mjs .github/workflows/bootstrap-datachart-v25.yml datachart-validation.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add data chart study module [skip ci]'
          git push origin HEAD:v25-data-chart
